    <title>Doodle Baseball - RetroBlasts</title>
    <link rel="canonical" href="https://retroblasts.com/doodle-baseball.html">
    <!-- v2.0 - Updated layout to match original Google Doodle -->
    <link rel="icon" href="favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .back-btn {
            background: rgba(255,255,255,0.9);
            border: 3px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .back-btn:hover { background: #fff; }

        .scoreboard {
            background: #2d5a27;
            border: 4px solid #1a3518;
            border-radius: 10px;
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            color: #7cfc00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .scoreboard .label { color: #fff; font-size: 12px; }
        .scoreboard .value { font-size: 24px; }

        .coins-display {
            background: rgba(255,255,255,0.9);
            border: 3px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: bold;
            color: #333;
        }

        #gameCanvas {
            border: 4px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            max-width: 100%;
        }

        .instructions {
            margin-top: 15px;
            background: rgba(255,255,255,0.9);
            padding: 10px 25px;
            border-radius: 25px;
            border: 3px solid #333;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .screen.hidden { display: none; }

        .title {
            font-size: clamp(36px, 10vw, 72px);
            color: #fff;
            text-shadow: 4px 4px 0 #e63946, 6px 6px 0 #333;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 22px;
            font-family: inherit;
            font-weight: bold;
            border: 4px solid #333;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-play {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            color: #fff;
        }
        .btn-menu {
            background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 100%);
            color: #fff;
        }

        .game-over-stats {
            background: rgba(255,255,255,0.95);
            padding: 25px 40px;
            border-radius: 20px;
            border: 4px solid #333;
            margin: 20px 0;
            text-align: center;
        }
        .final-score {
            font-size: 48px;
            color: #e63946;
            font-weight: bold;
        }
        .stat-row {
            font-size: 18px;
            color: #333;
            margin: 8px 0;
        }
        .coins-earned {
            font-size: 24px;
            color: #f59e0b;
            font-weight: bold;
            margin-top: 15px;
        }
        .new-record {
            background: #ffd700;
            color: #333;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
            animation: pulse 0.5s ease infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        .food-lineup {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .food-char {
            font-size: 32px;
            background: rgba(255,255,255,0.9);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #333;
        }
        .food-char.active {
            background: #ffd700;
            transform: scale(1.1);
            box-shadow: 0 0 15px #ffd700;
        }
        .food-char.out {
            opacity: 0.3;
            background: #999;
        }
    </style>

<body>
    <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">← Back</button>
        <div class="scoreboard">
            <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
            <div><div class="label">OUTS</div><div class="value" id="outs">0</div></div>
        </div>
        <div class="coins-display">🪙 <span id="totalCoins">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="instructions" id="instructions">👆 Click or Press SPACE to Swing!</div>

    <!-- Start Screen -->
    <div class="screen" id="startScreen">
        <div class="title">⚾ DOODLE BASEBALL</div>
        <div class="subtitle">Hit home runs with your food team!</div>
        <div class="food-lineup">
            <div class="food-char">🌭</div>
            <div class="food-char">🍟</div>
            <div class="food-char">🍕</div>
            <div class="food-char">🌮</div>
            <div class="food-char">🍔</div>
            <div class="food-char">🥤</div>
        </div>
        <button class="btn btn-play" onclick="startGame()">⚾ PLAY BALL!</button>
        <div style="color:#aaa;margin-top:20px;font-size:14px;">Best Score: <span id="bestScore">0</span></div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen hidden" id="gameOverScreen">
        <div class="title" style="font-size:48px;">GAME OVER!</div>
        <div class="game-over-stats">
            <div class="final-score" id="finalScore">0</div>
            <div class="stat-row">Home Runs: <span id="statHR">0</span></div>
            <div class="stat-row">Hits: <span id="statHits">0</span></div>
            <div class="new-record hidden" id="newRecord">🏆 NEW HIGH SCORE!</div>
            <div class="coins-earned">+<span id="coinsEarned">0</span> 🪙</div>
        </div>
        <button class="btn btn-play" onclick="startGame()">⚾ PLAY AGAIN</button>
        <button class="btn btn-menu" onclick="showMenu()">MENU</button>
    </div>

    <script>
    // ==================== GAME CONFIG ====================
    const BATTERS = ['🌭', '🍟', '🍕', '🌮', '🍔', '🥤', '🧇', '🥨', '🍩'];
    const PITCHER = '🥜';

    const FIELD_COLOR = '#4a7c23';
    const DIRT_COLOR = '#c4a574';
    const SKY_COLORS = ['#87CEEB', '#98D8E8'];

    // ==================== SAVE SYSTEM ====================
    let currentUsername = null;
    let saveData = { coins: 0, bestScore: 0, gamesPlayed: 0, totalHomeRuns: 0 };

    function getSaveKey() {
        return currentUsername ? `doodleBaseball_${currentUsername}` : 'doodleBaseball_guest';
    }

    async function loadUser() {
        try {
            const resp = await fetch('api/auth.php?action=check', { credentials: 'include' });
            const data = await resp.json();
            if (data.loggedIn && data.user) {
                currentUsername = data.user.username;
                localStorage.setItem('arcadeUser', JSON.stringify(data.user));
            }
        } catch (e) {
            const cached = localStorage.getItem('arcadeUser');
            if (cached) {
                try { currentUsername = JSON.parse(cached).username; } catch(err) {}
            }
        }
        loadSaveData();
        updateUI();
    }

    function loadSaveData() {
        const saved = localStorage.getItem(getSaveKey());
        if (saved) {
            saveData = { ...saveData, ...JSON.parse(saved) };
        }
    }

    function save() {
        localStorage.setItem(getSaveKey(), JSON.stringify(saveData));
        if (currentUsername) {
            fetch('api/game-stats.php', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'save', game: 'doodle-baseball', data: saveData })
            }).catch(() => {});
        }
    }

    function updateUI() {
        document.getElementById('totalCoins').textContent = saveData.coins.toLocaleString();
        document.getElementById('bestScore').textContent = saveData.bestScore.toLocaleString();
    }

    // ==================== GAME STATE ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'menu'; // menu, playing, pitching, batting, hit, gameOver
    let score = 0;
    let outs = 0;
    let currentBatterIndex = 0;
    let stats = { hits: 0, homeRuns: 0, strikes: 0 };

    // Ball state
    let ball = { x: 0, y: 0, vx: 0, vy: 0, visible: false, hit: false };
    let ballTrail = [];

    // Pitch types with hat colors (matching original Google Doodle game)
    const PITCH_TYPES = {
        fastball:  { color: '#e63946', speed: 14, type: 'straight', name: 'Fastball' },    // Red - fast, straight
        zigzag:    { color: '#f4d03f', speed: 9, type: 'zigzag', name: 'Zigzag' },         // Yellow - zigzag pattern
        highArc:   { color: '#3498db', speed: 7, type: 'highArc', name: 'High Arc' },      // Blue - goes high, comes down
        loopdeloop:{ color: '#2ecc71', speed: 8, type: 'loop', name: 'Loop-de-loop' },     // Green - loop-de-loops
        fadeaway:  { color: '#9b59b6', speed: 10, type: 'fade', name: 'Fadeaway' },        // Purple - fades out near batter
        slowball:  { color: '#ecf0f1', speed: 6, type: 'straight', name: 'Slow Ball' }    // White - slow, right down middle
    };
    let currentPitch = 'fastball';
    let pitchTime = 0; // Track time for pitch animations

    // Pitcher state - upper right on grass, like original Google Doodle
    let pitcher = { x: 680, y: 310, windUp: 0, throwing: false };

    // Batter state - left side near home plate, like original
    let batter = { x: 280, y: 410, swinging: false, swingFrame: 0, canSwing: true };

    // Hit result
    let hitResult = { text: '', timer: 0, x: 0, y: 0 };

    // Timing
    let pitchTimer = 0;
    let gameLoopId = null;

    // ==================== DRAWING ====================
    // Store crowd positions (mix of colored dots and food fans)
    let crowdPositions = [];
    const CROWD_FOODS = ['🌭', '🍟', '🍕', '🌮', '🍔', '🥤', '🧇', '🥨', '🍩', '🍿', '🥜', '🍦'];
    function initCrowd() {
        crowdPositions = [];
        const colors = ['#e63946', '#f4a261', '#2a9d8f', '#e9c46a', '#264653', '#fff', '#3498db', '#9b59b6'];
        for (let i = 0; i < 100; i++) {
            const isFood = Math.random() < 0.3;  // 30% chance of food character
            crowdPositions.push({
                x: 8 + i * 8,
                y: 215 + Math.sin(i * 0.7) * 8,
                isFood: isFood,
                food: CROWD_FOODS[Math.floor(Math.random() * CROWD_FOODS.length)],
                color: colors[Math.floor(Math.random() * colors.length)],
                size: isFood ? 12 : (3 + Math.random() * 2)
            });
        }
    }
    initCrowd();

    function drawField() {
        // Sky gradient - light blue like the original
        const skyGrad = ctx.createLinearGradient(0, 0, 0, 220);
        skyGrad.addColorStop(0, '#6BB8E0');
        skyGrad.addColorStop(1, '#A8D8EA');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, 800, 220);

        // Big fluffy clouds like the original
        ctx.fillStyle = '#fff';
        drawBigCloud(100, 70, 50);
        drawBigCloud(380, 55, 45);
        drawBigCloud(670, 45, 30);

        // Dark green grass background (outfield wall/stands area)
        ctx.fillStyle = '#2d6a1e';
        ctx.fillRect(0, 210, 800, 40);

        // Crowd - colorful dots in wavy line (like original)
        for (const dot of crowdPositions) {
            if (dot.isFood) {
                ctx.font = `${dot.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(dot.food, dot.x, dot.y + 20);
            } else {
                ctx.fillStyle = dot.color;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y + 20, dot.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Main grass field (bright green)
        ctx.fillStyle = '#4a8c23';
        ctx.fillRect(0, 250, 800, 250);

        // Grass mowing lines radiating from center (like original)
        ctx.strokeStyle = 'rgba(90, 140, 42, 0.4)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(420, 500);
            ctx.lineTo(420 + Math.cos(angle) * 450, 250);
            ctx.stroke();
        }

        // Pitcher's mound - ON THE GRASS in upper right (separate from dirt diamond)
        ctx.fillStyle = '#B89968';
        ctx.beginPath();
        ctx.ellipse(650, 340, 45, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Infield dirt diamond - lower portion of screen
        ctx.fillStyle = '#C4A574';
        ctx.beginPath();
        ctx.moveTo(180, 470);   // Left corner (3rd base side)
        ctx.lineTo(420, 340);   // Top corner (2nd base)
        ctx.lineTo(660, 470);   // Right corner (1st base side)
        ctx.lineTo(420, 500);   // Bottom corner (home plate)
        ctx.closePath();
        ctx.fill();

        // Foul lines (white) - from home plate to outfield
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(180, 470);
        ctx.lineTo(0, 250);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(660, 470);
        ctx.lineTo(800, 250);
        ctx.stroke();

        // Bases - white diamonds
        drawBase(420, 355, 1.0);   // Second base
        drawBase(290, 430, 1.0);   // Third base
        drawBase(550, 430, 1.0);   // First base

        // Home plate (pentagon) - at batter position
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(250, 465);
        ctx.lineTo(260, 455);
        ctx.lineTo(280, 455);
        ctx.lineTo(290, 465);
        ctx.lineTo(270, 480);
        ctx.closePath();
        ctx.fill();
    }

    function drawBigCloud(x, y, size) {
        ctx.beginPath();
        // Main body
        ctx.arc(x, y, size, 0, Math.PI * 2);
        // Left bump
        ctx.arc(x - size * 0.7, y + size * 0.1, size * 0.7, 0, Math.PI * 2);
        // Right bump
        ctx.arc(x + size * 0.8, y + size * 0.05, size * 0.65, 0, Math.PI * 2);
        // Top bump
        ctx.arc(x + size * 0.2, y - size * 0.3, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBase(x, y, scale = 1) {
        const size = 12 * scale;
        ctx.fillStyle = '#fff';
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-size, -size, size * 2, size * 2);
        ctx.restore();
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 1;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeRect(-size, -size, size * 2, size * 2);
        ctx.restore();
    }

    function drawPitcher() {
        const p = pitcher;
        const wobble = Math.sin(Date.now() * 0.005) * 2;

        ctx.save();
        ctx.translate(p.x, p.y + wobble);

        // Wind-up animation
        if (p.throwing && p.windUp < 1) {
            ctx.rotate(Math.sin(p.windUp * Math.PI) * 0.25);
            ctx.translate(0, -p.windUp * 15);
        }

        // Shadow on ground
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 45, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hat (colored based on pitch type) - positioned above the peanut
        const hatColor = PITCH_TYPES[currentPitch].color;
        ctx.fillStyle = hatColor;
        // Hat dome
        ctx.beginPath();
        ctx.arc(0, -32, 18, Math.PI, 0, false);
        ctx.fill();
        // Hat brim (extends forward)
        ctx.fillStyle = hatColor;
        ctx.beginPath();
        ctx.ellipse(0, -32, 22, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Peanut body emoji
        ctx.font = '50px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(PITCHER, 0, 0);

        // Arm with ball (during wind-up)
        if (p.throwing && p.windUp < 0.8) {
            ctx.font = '16px Arial';
            const armX = -20 - Math.sin(p.windUp * Math.PI) * 15;
            const armY = -25 - Math.cos(p.windUp * Math.PI) * 25;
            ctx.fillText('⚾', armX, armY);
        }

        ctx.restore();
    }

    function drawBatter() {
        const b = batter;

        ctx.save();
        ctx.translate(b.x, b.y);

        // Shadow on ground
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 40, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Swing animation
        let batAngle = -0.6; // Ready position (bat raised back)
        if (b.swinging) {
            // Swing through - bat comes forward
            batAngle = -0.6 + b.swingFrame * 0.25;
        }

        // Draw bat first (behind character when raised)
        ctx.save();
        ctx.translate(20, -20);  // Position at "hands"
        ctx.rotate(batAngle);

        // Bat barrel (top/end)
        ctx.fillStyle = '#D2691E';
        ctx.beginPath();
        ctx.ellipse(0, -50, 8, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bat handle
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(-4, -40, 8, 50);

        ctx.restore();

        // Batter character (food emoji)
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(BATTERS[currentBatterIndex % BATTERS.length], 0, 0);

        ctx.restore();
    }

    function drawBall() {
        if (!ball.visible) return;

        // Get opacity (for fadeaway pitch)
        const opacity = ball.opacity !== undefined ? ball.opacity : 1;

        const ballSize = 12;

        // Ball trail (white streak behind)
        ctx.save();
        ctx.globalAlpha = opacity * 0.6;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i < ballTrail.length; i++) {
            const t = ballTrail[i];
            if (i === 0) ctx.moveTo(t.x, t.y);
            else ctx.lineTo(t.x, t.y);
        }
        ctx.stroke();
        ctx.restore();

        // Ball shadow on ground
        ctx.save();
        ctx.globalAlpha = opacity * 0.25;
        ctx.fillStyle = '#000';
        // Shadow follows ball x position, stays on ground
        ctx.beginPath();
        ctx.ellipse(ball.x, 470, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // The baseball
        ctx.save();
        ctx.globalAlpha = opacity;

        // White ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballSize, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#cc0000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Red stitching (simplified)
        ctx.strokeStyle = '#cc0000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ball.x - 4, ball.y, 6, -0.5, 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ball.x + 4, ball.y, 6, Math.PI - 0.5, Math.PI + 0.5);
        ctx.stroke();

        ctx.restore();
    }

    function drawHitResult() {
        if (hitResult.timer <= 0) return;

        ctx.save();
        ctx.globalAlpha = Math.min(1, hitResult.timer / 30);

        const scale = 1 + (60 - hitResult.timer) * 0.02;
        ctx.translate(hitResult.x, hitResult.y - (60 - hitResult.timer) * 2);
        ctx.scale(scale, scale);

        ctx.font = 'bold 36px Comic Sans MS, cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Text outline
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.strokeText(hitResult.text, 0, 0);

        // Text fill
        let color = '#fff';
        if (hitResult.text.includes('HOME RUN')) color = '#ffd700';
        else if (hitResult.text.includes('TRIPLE')) color = '#c0c0c0';
        else if (hitResult.text.includes('DOUBLE')) color = '#cd7f32';
        else if (hitResult.text.includes('SINGLE')) color = '#90EE90';
        else if (hitResult.text.includes('OUT') || hitResult.text.includes('STRIKE')) color = '#ff6b6b';

        ctx.fillStyle = color;
        ctx.fillText(hitResult.text, 0, 0);

        ctx.restore();
    }

    function drawBatterLineup() {
        // On-deck batters shown in bottom-left corner (like the original)
        const startX = 40;
        const startY = 480;

        ctx.save();

        // Current batter highlight (yellow/gold circle)
        ctx.beginPath();
        ctx.arc(startX, startY, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700';
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Current batter emoji
        ctx.font = '22px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(BATTERS[currentBatterIndex % BATTERS.length], startX, startY);

        // Next batters (on deck)
        for (let i = 1; i <= 2; i++) {
            const idx = (currentBatterIndex + i) % BATTERS.length;

            ctx.beginPath();
            ctx.arc(startX + i * 38, startY, 16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = '18px Arial';
            ctx.fillText(BATTERS[idx], startX + i * 38, startY);
        }

        // "ON DECK" label below
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('ON DECK', startX + 38, startY + 25);

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawField();
        drawPitcher();
        drawBatter();
        drawBall();
        drawHitResult();
        drawBatterLineup();
    }

    // ==================== GAME LOGIC ====================
    function pitch() {
        if (gameState !== 'playing') return;

        // Randomly select pitch type (weighted - fastballs more common early, more variety later)
        const pitchTypes = ['fastball', 'fastball', 'slowball', 'zigzag', 'highArc', 'loopdeloop', 'fadeaway'];
        currentPitch = pitchTypes[Math.floor(Math.random() * pitchTypes.length)];

        gameState = 'pitching';
        pitcher.throwing = true;
        pitcher.windUp = 0;
        batter.canSwing = false;

        // Wind-up animation
        const windUpAnim = setInterval(() => {
            pitcher.windUp += 0.05;
            if (pitcher.windUp >= 1) {
                clearInterval(windUpAnim);
                throwBall();
            }
        }, 30);
    }

    function throwBall() {
        // Ball starts at pitcher's hand position
        ball.x = pitcher.x - 30;
        ball.y = pitcher.y - 30;
        ball.visible = true;
        ball.hit = false;
        ball.opacity = 1;
        ballTrail = [];
        pitchTime = 0;

        // Get pitch properties
        const pitchData = PITCH_TYPES[currentPitch];

        // Target is the batter's strike zone
        const targetX = batter.x + 50;
        const targetY = batter.y - 20;

        // Calculate direction
        const dx = targetX - ball.x;
        const dy = targetY - ball.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const speed = pitchData.speed;

        // Ball travels toward batter
        ball.vx = (dx / distance) * speed;
        ball.vy = (dy / distance) * speed;

        // Store base values for special pitches
        ball.baseVx = ball.vx;
        ball.baseVy = ball.vy;
        ball.baseY = ball.y;
        ball.startX = ball.x;
        ball.pitchType = pitchData.type;

        // High arc pitch goes up first
        if (pitchData.type === 'highArc') {
            ball.vy = -5;
        }

        gameState = 'batting';
        batter.canSwing = true;
        pitcher.throwing = false;

        playSound('throw');
    }

    function swing() {
        if (gameState !== 'batting' || !batter.canSwing || batter.swinging) return;

        batter.swinging = true;
        batter.swingFrame = 0;
        batter.canSwing = false;

        playSound('swing');

        // Hit zone - area where bat can connect with ball
        const hitZone = {
            x: batter.x + 60,
            y: batter.y - 15,
            width: 90,
            height: 60
        };

        const inZone = ball.visible &&
            ball.x > hitZone.x - hitZone.width / 2 &&
            ball.x < hitZone.x + hitZone.width / 2 &&
            ball.y > hitZone.y - hitZone.height / 2 &&
            ball.y < hitZone.y + hitZone.height / 2;

        if (inZone) {
            // Better timing = better hit
            const centerX = hitZone.x;
            const centerY = hitZone.y;
            const distFromCenter = Math.sqrt(
                Math.pow(ball.x - centerX, 2) +
                Math.pow(ball.y - centerY, 2)
            );
            const hitQuality = 1 - (distFromCenter / 55);

            hitBall(Math.max(0.1, Math.min(1, hitQuality)));
        }

        // Swing animation
        const swingAnim = setInterval(() => {
            batter.swingFrame++;
            if (batter.swingFrame > 10) {
                clearInterval(swingAnim);
                batter.swinging = false;
                batter.swingFrame = 0;
            }
        }, 25);
    }

    function hitBall(quality) {
        ball.hit = true;
        ball.opacity = 1;  // Reset opacity in case it was a fadeaway
        gameState = 'hit';

        // Determine hit type based on quality
        const rand = Math.random();
        const power = quality * 0.7 + rand * 0.3;

        let hitType, points, resultText;

        if (power > 0.85) {
            hitType = 'homerun';
            points = 100;
            resultText = '💥 HOME RUN! 💥';
            stats.homeRuns++;
            stats.hits++;
        } else if (power > 0.7) {
            hitType = 'triple';
            points = 50;
            resultText = 'TRIPLE!';
            stats.hits++;
        } else if (power > 0.5) {
            hitType = 'double';
            points = 25;
            resultText = 'DOUBLE!';
            stats.hits++;
        } else if (power > 0.3) {
            hitType = 'single';
            points = 10;
            resultText = 'SINGLE!';
            stats.hits++;
        } else {
            hitType = 'out';
            points = 0;
            resultText = 'OUT!';
            outs++;
        }

        // Ball flies toward outfield (right side, upward)
        const hitAngle = (Math.random() - 0.5) * 0.8;  // Slight angle variation

        if (hitType === 'homerun') {
            ball.vx = 15 + Math.random() * 5;
            ball.vy = -12 - Math.random() * 5;
            playSound('homerun');
        } else if (hitType !== 'out') {
            ball.vx = 8 + power * 8;
            ball.vy = -6 - power * 5;
            playSound('hit');
        } else {
            ball.vx = 4 + Math.random() * 4;
            ball.vy = -2 - Math.random() * 3;
            playSound('out');
        }

        // Add angle variation
        ball.vy += hitAngle * 5;

        // Update score
        score += points;
        document.getElementById('score').textContent = score;
        document.getElementById('outs').textContent = outs;

        // Show result
        hitResult.text = resultText;
        hitResult.timer = 60;
        hitResult.x = 400;
        hitResult.y = 200;

        // Next batter or game over
        setTimeout(() => {
            if (outs >= 3) {
                endGame();
            } else {
                if (hitType !== 'out') {
                    currentBatterIndex++;
                }
                nextPitch();
            }
        }, hitType === 'homerun' ? 2000 : 1200);
    }

    function strike() {
        stats.strikes++;

        hitResult.text = 'STRIKE!';
        hitResult.timer = 40;
        hitResult.x = 400;
        hitResult.y = 250;

        playSound('strike');

        // 3 strikes = out
        if (stats.strikes >= 3) {
            stats.strikes = 0;
            outs++;
            document.getElementById('outs').textContent = outs;

            setTimeout(() => {
                hitResult.text = 'STRIKE OUT!';
                hitResult.timer = 50;

                setTimeout(() => {
                    if (outs >= 3) {
                        endGame();
                    } else {
                        currentBatterIndex++;
                        nextPitch();
                    }
                }, 800);
            }, 300);
        } else {
            setTimeout(nextPitch, 800);
        }
    }

    function nextPitch() {
        ball.visible = false;
        ball.hit = false;
        ballTrail = [];
        gameState = 'playing';

        // Random delay before next pitch
        pitchTimer = setTimeout(pitch, 1000 + Math.random() * 500);
    }

    function update() {
        // Update ball
        if (ball.visible) {
            pitchTime++;

            // Add to trail
            ballTrail.push({ x: ball.x, y: ball.y });
            if (ballTrail.length > 8) ballTrail.shift();

            if (!ball.hit) {
                // Apply pitch-specific movement
                switch (ball.pitchType) {
                    case 'zigzag':
                        // Yellow - zigzag up and down as it travels
                        ball.x += ball.baseVx;
                        ball.y = ball.baseY + Math.sin(pitchTime * 0.35) * 30;
                        ball.baseY += ball.baseVy * 0.3;
                        break;

                    case 'highArc':
                        // Blue - goes high then drops down
                        ball.x += ball.vx;
                        ball.vy += 0.35;  // Gravity pulls it down
                        ball.y += ball.vy;
                        break;

                    case 'loop':
                        // Green - loop-de-loops as it travels
                        ball.x += ball.baseVx;
                        ball.y += ball.baseVy * 0.3;
                        // Circular loop motion
                        ball.x += Math.sin(pitchTime * 0.25) * 4;
                        ball.y += Math.cos(pitchTime * 0.5) * 6;
                        break;

                    case 'fade':
                        // Purple - normal trajectory but fades near batter
                        ball.x += ball.vx;
                        ball.y += ball.vy;
                        // Fade out when approaching batter
                        const distToBatter = ball.x - batter.x;
                        if (distToBatter < 180) {
                            ball.opacity = Math.max(0.1, distToBatter / 180);
                        }
                        break;

                    case 'straight':
                    default:
                        // Straight pitch - slight natural drop
                        ball.x += ball.vx;
                        ball.y += ball.vy;
                        ball.vy += 0.08;  // Very slight gravity
                        break;
                }

                // Ball went past batter (strike)
                if (ball.x < batter.x - 20) {
                    ball.visible = false;
                    strike();
                }
            } else {
                // Ball was hit - flies toward outfield
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.35;  // Gravity
            }

            // Ball off screen
            if (ball.x > 850 || ball.y > 520 || ball.x < -50 || ball.y < -100) {
                ball.visible = false;
            }
        }

        // Update hit result timer
        if (hitResult.timer > 0) {
            hitResult.timer--;
        }
    }

    function gameLoop() {
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // ==================== SOUND ====================
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            switch(type) {
                case 'throw':
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                    break;
                case 'swing':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                    break;
                case 'hit':
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                    break;
                case 'homerun':
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                    // Crowd cheer
                    setTimeout(() => {
                        const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
                        const noise = ctx2.createOscillator();
                        const g = ctx2.createGain();
                        noise.type = 'sawtooth';
                        noise.frequency.setValueAtTime(200, ctx2.currentTime);
                        noise.connect(g);
                        g.connect(ctx2.destination);
                        g.gain.setValueAtTime(0.1, ctx2.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx2.currentTime + 0.8);
                        noise.start(); noise.stop(ctx2.currentTime + 0.8);
                    }, 200);
                    break;
                case 'strike':
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                    break;
                case 'out':
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                    break;
            }
        } catch(e) {}
    }

    // ==================== GAME FLOW ====================
    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('instructions').style.display = 'block';

        score = 0;
        outs = 0;
        currentBatterIndex = 0;
        stats = { hits: 0, homeRuns: 0, strikes: 0 };
        ball.visible = false;
        ballTrail = [];
        hitResult.timer = 0;

        document.getElementById('score').textContent = '0';
        document.getElementById('outs').textContent = '0';

        gameState = 'playing';

        if (!gameLoopId) {
            gameLoop();
        }

        setTimeout(pitch, 1500);
    }

    function endGame() {
        gameState = 'gameOver';
        clearTimeout(pitchTimer);

        // Calculate coins
        const coinsEarned = Math.floor(score / 5) + stats.homeRuns * 10;
        saveData.coins += coinsEarned;
        saveData.gamesPlayed++;
        saveData.totalHomeRuns += stats.homeRuns;

        // Check for new record
        const isNewRecord = score > saveData.bestScore;
        if (isNewRecord) {
            saveData.bestScore = score;
        }

        save();
        updateUI();

        // Show game over screen
        document.getElementById('finalScore').textContent = score;
        document.getElementById('statHR').textContent = stats.homeRuns;
        document.getElementById('statHits').textContent = stats.hits;
        document.getElementById('coinsEarned').textContent = coinsEarned;

        if (isNewRecord) {
            document.getElementById('newRecord').classList.remove('hidden');
        } else {
            document.getElementById('newRecord').classList.add('hidden');
        }

        document.getElementById('instructions').style.display = 'none';
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function showMenu() {
        gameState = 'menu';
        clearTimeout(pitchTimer);
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
    }

    // ==================== INPUT ====================
    canvas.addEventListener('click', () => {
        if (gameState === 'batting') {
            swing();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState === 'batting') {
                swing();
            } else if (gameState === 'menu') {
                startGame();
            }
        }
    });

    // Prevent double-tap zoom on mobile
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (gameState === 'batting') {
            swing();
        }
    });

    // ==================== INIT ====================
    loadUser();
    draw();
    </script>
</body>
</html>
