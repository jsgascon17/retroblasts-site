<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Doodle Baseball - Hit home runs with your favorite food characters!">
    <title>Doodle Baseball - RetroBlasts</title>
    <link rel="icon" href="favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .back-btn {
            background: rgba(255,255,255,0.9);
            border: 3px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .back-btn:hover { background: #fff; }

        .scoreboard {
            background: #2d5a27;
            border: 4px solid #1a3518;
            border-radius: 10px;
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            color: #7cfc00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .scoreboard .label { color: #fff; font-size: 12px; }
        .scoreboard .value { font-size: 24px; }

        .coins-display {
            background: rgba(255,255,255,0.9);
            border: 3px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: bold;
            color: #333;
        }

        #gameCanvas {
            border: 4px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            max-width: 100%;
        }

        .instructions {
            margin-top: 15px;
            background: rgba(255,255,255,0.9);
            padding: 10px 25px;
            border-radius: 25px;
            border: 3px solid #333;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .screen.hidden { display: none; }

        .title {
            font-size: clamp(36px, 10vw, 72px);
            color: #fff;
            text-shadow: 4px 4px 0 #e63946, 6px 6px 0 #333;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 22px;
            font-family: inherit;
            font-weight: bold;
            border: 4px solid #333;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-play {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            color: #fff;
        }
        .btn-menu {
            background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 100%);
            color: #fff;
        }

        .game-over-stats {
            background: rgba(255,255,255,0.95);
            padding: 25px 40px;
            border-radius: 20px;
            border: 4px solid #333;
            margin: 20px 0;
            text-align: center;
        }
        .final-score {
            font-size: 48px;
            color: #e63946;
            font-weight: bold;
        }
        .stat-row {
            font-size: 18px;
            color: #333;
            margin: 8px 0;
        }
        .coins-earned {
            font-size: 24px;
            color: #f59e0b;
            font-weight: bold;
            margin-top: 15px;
        }
        .new-record {
            background: #ffd700;
            color: #333;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
            animation: pulse 0.5s ease infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        .food-lineup {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .food-char {
            font-size: 32px;
            background: rgba(255,255,255,0.9);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #333;
        }
        .food-char.active {
            background: #ffd700;
            transform: scale(1.1);
            box-shadow: 0 0 15px #ffd700;
        }
        .food-char.out {
            opacity: 0.3;
            background: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">← Back</button>
        <div class="scoreboard">
            <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
            <div><div class="label">OUTS</div><div class="value" id="outs">0</div></div>
        </div>
        <div class="coins-display">🪙 <span id="totalCoins">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="instructions" id="instructions">👆 Click or Press SPACE to Swing!</div>

    <!-- Start Screen -->
    <div class="screen" id="startScreen">
        <div class="title">⚾ DOODLE BASEBALL</div>
        <div class="subtitle">Hit home runs with your food team!</div>
        <div class="food-lineup">
            <div class="food-char">🌭</div>
            <div class="food-char">🍟</div>
            <div class="food-char">🍕</div>
            <div class="food-char">🌮</div>
            <div class="food-char">🍔</div>
            <div class="food-char">🥤</div>
        </div>
        <button class="btn btn-play" onclick="startGame()">⚾ PLAY BALL!</button>
        <div style="color:#aaa;margin-top:20px;font-size:14px;">Best Score: <span id="bestScore">0</span></div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen hidden" id="gameOverScreen">
        <div class="title" style="font-size:48px;">GAME OVER!</div>
        <div class="game-over-stats">
            <div class="final-score" id="finalScore">0</div>
            <div class="stat-row">Home Runs: <span id="statHR">0</span></div>
            <div class="stat-row">Hits: <span id="statHits">0</span></div>
            <div class="new-record hidden" id="newRecord">🏆 NEW HIGH SCORE!</div>
            <div class="coins-earned">+<span id="coinsEarned">0</span> 🪙</div>
        </div>
        <button class="btn btn-play" onclick="startGame()">⚾ PLAY AGAIN</button>
        <button class="btn btn-menu" onclick="showMenu()">MENU</button>
    </div>

    <script>
    // ==================== GAME CONFIG ====================
    const BATTERS = ['🌭', '🍟', '🍕', '🌮', '🍔', '🥤', '🧇', '🥨', '🍩'];
    const PITCHER = '🥜';

    const FIELD_COLOR = '#4a7c23';
    const DIRT_COLOR = '#c4a574';
    const SKY_COLORS = ['#87CEEB', '#98D8E8'];

    // ==================== SAVE SYSTEM ====================
    let currentUsername = null;
    let saveData = { coins: 0, bestScore: 0, gamesPlayed: 0, totalHomeRuns: 0 };

    function getSaveKey() {
        return currentUsername ? `doodleBaseball_${currentUsername}` : 'doodleBaseball_guest';
    }

    async function loadUser() {
        try {
            const resp = await fetch('api/auth.php?action=check', { credentials: 'include' });
            const data = await resp.json();
            if (data.loggedIn && data.user) {
                currentUsername = data.user.username;
                localStorage.setItem('arcadeUser', JSON.stringify(data.user));
            }
        } catch (e) {
            const cached = localStorage.getItem('arcadeUser');
            if (cached) {
                try { currentUsername = JSON.parse(cached).username; } catch(err) {}
            }
        }
        loadSaveData();
        updateUI();
    }

    function loadSaveData() {
        const saved = localStorage.getItem(getSaveKey());
        if (saved) {
            saveData = { ...saveData, ...JSON.parse(saved) };
        }
    }

    function save() {
        localStorage.setItem(getSaveKey(), JSON.stringify(saveData));
        if (currentUsername) {
            fetch('api/game-stats.php', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'save', game: 'doodle-baseball', data: saveData })
            }).catch(() => {});
        }
    }

    function updateUI() {
        document.getElementById('totalCoins').textContent = saveData.coins.toLocaleString();
        document.getElementById('bestScore').textContent = saveData.bestScore.toLocaleString();
    }

    // ==================== GAME STATE ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'menu'; // menu, playing, pitching, batting, hit, gameOver
    let score = 0;
    let outs = 0;
    let currentBatterIndex = 0;
    let stats = { hits: 0, homeRuns: 0, strikes: 0 };

    // Ball state
    let ball = { x: 0, y: 0, vx: 0, vy: 0, visible: false, hit: false };
    let ballTrail = [];

    // Pitch types with hat colors (matching original Google Doodle game)
    const PITCH_TYPES = {
        fastball:  { color: '#e63946', speed: 14, type: 'straight', name: 'Fastball' },    // Red - fast, straight
        zigzag:    { color: '#f4d03f', speed: 9, type: 'zigzag', name: 'Zigzag' },         // Yellow - zigzag pattern
        highArc:   { color: '#3498db', speed: 7, type: 'highArc', name: 'High Arc' },      // Blue - goes high, comes down
        loopdeloop:{ color: '#2ecc71', speed: 8, type: 'loop', name: 'Loop-de-loop' },     // Green - loop-de-loops
        fadeaway:  { color: '#9b59b6', speed: 10, type: 'fade', name: 'Fadeaway' },        // Purple - fades out near batter
        slowball:  { color: '#ecf0f1', speed: 6, type: 'straight', name: 'Slow Ball' }    // White - slow, right down middle
    };
    let currentPitch = 'fastball';
    let pitchTime = 0; // Track time for pitch animations

    // Pitcher state (in the distance, center of screen)
    let pitcher = { x: 400, y: 180, windUp: 0, throwing: false };

    // Batter state (foreground - just the bat visible)
    let batter = { x: 400, y: 450, swinging: false, swingFrame: 0, canSwing: true };

    // Hit result
    let hitResult = { text: '', timer: 0, x: 0, y: 0 };

    // Timing
    let pitchTimer = 0;
    let gameLoopId = null;

    // ==================== DRAWING ====================
    function drawField() {
        // Sky gradient (top half of screen)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, 200);
        skyGrad.addColorStop(0, '#5BA3D9');
        skyGrad.addColorStop(1, '#87CEEB');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, 800, 200);

        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        drawCloud(100, 50, 30);
        drawCloud(300, 35, 25);
        drawCloud(550, 55, 28);
        drawCloud(700, 25, 20);

        // Stadium/crowd background (distant)
        ctx.fillStyle = '#2d5a27';
        ctx.fillRect(0, 170, 800, 50);

        // Crowd dots (smaller - they're far away)
        for (let i = 0; i < 100; i++) {
            const colors = ['#e63946', '#f4a261', '#2a9d8f', '#e9c46a', '#264653', '#fff'];
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.beginPath();
            ctx.arc(8 + i * 8, 185 + Math.sin(i * 0.5) * 6, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Outfield grass (perspective - horizon to foreground)
        const grassGrad = ctx.createLinearGradient(0, 200, 0, 500);
        grassGrad.addColorStop(0, '#4a7c23');
        grassGrad.addColorStop(1, '#3d6a1e');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, 200, 800, 300);

        // Grass mowing lines (converging to horizon for perspective)
        ctx.strokeStyle = '#5a8c2a';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
            ctx.beginPath();
            ctx.moveTo(400 + (i - 5.5) * 10, 210);  // Horizon point
            ctx.lineTo(400 + (i - 5.5) * 80, 500);  // Spread out in foreground
            ctx.stroke();
        }

        // Pitcher's mound (in distance, center)
        ctx.fillStyle = '#b89968';
        ctx.beginPath();
        ctx.ellipse(400, 230, 35, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8a7a58';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pitcher's rubber
        ctx.fillStyle = '#fff';
        ctx.fillRect(390, 225, 20, 4);

        // Infield dirt (perspective trapezoid)
        ctx.fillStyle = DIRT_COLOR;
        ctx.beginPath();
        ctx.moveTo(250, 250);   // Left back corner
        ctx.lineTo(550, 250);   // Right back corner
        ctx.lineTo(750, 480);   // Right front corner
        ctx.lineTo(50, 480);    // Left front corner
        ctx.closePath();
        ctx.fill();

        // Second base (distant)
        drawBase(400, 260, 0.6);

        // First and third bases (mid-distance)
        drawBase(520, 330, 0.8);  // First base
        drawBase(280, 330, 0.8);  // Third base

        // Foul lines (perspective)
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        // Left foul line
        ctx.moveTo(400, 500);
        ctx.lineTo(0, 200);
        // Right foul line
        ctx.moveTo(400, 500);
        ctx.lineTo(800, 200);
        ctx.stroke();

        // Strike zone indicator (transparent box)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(340, 340, 120, 100);
    }

    function drawCloud(x, y, size) {
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.arc(x + size * 0.8, y - size * 0.2, size * 0.7, 0, Math.PI * 2);
        ctx.arc(x + size * 1.4, y, size * 0.6, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBase(x, y, scale = 1) {
        const size = 12 * scale;
        ctx.fillStyle = '#fff';
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-size, -size, size * 2, size * 2);
        ctx.restore();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2 * scale;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeRect(-size, -size, size * 2, size * 2);
        ctx.restore();
    }

    function drawPitcher() {
        const p = pitcher;
        const wobble = Math.sin(Date.now() * 0.005) * 1;
        const scale = 0.5; // Smaller because pitcher is in the distance

        ctx.save();
        ctx.translate(p.x, p.y + wobble);
        ctx.scale(scale, scale);

        // Wind-up animation
        if (p.throwing && p.windUp < 1) {
            ctx.rotate(Math.sin(p.windUp * Math.PI) * 0.2);
            ctx.translate(0, -p.windUp * 15);
        }

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 50, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hat (colored based on pitch type)
        const hatColor = PITCH_TYPES[currentPitch].color;
        ctx.fillStyle = hatColor;
        // Hat cap
        ctx.beginPath();
        ctx.ellipse(0, -24, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // Hat dome
        ctx.beginPath();
        ctx.arc(0, -28, 15, Math.PI, 0, false);
        ctx.fill();
        // Hat brim
        ctx.fillRect(-20, -24, 40, 4);
        // Hat outline
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -28, 15, Math.PI, 0, false);
        ctx.stroke();

        // Body (peanut)
        ctx.font = '50px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(PITCHER, 0, 0);

        // Arm with ball (during wind-up)
        if (p.throwing && p.windUp < 0.8) {
            ctx.font = '18px Arial';
            const armX = Math.cos(p.windUp * Math.PI * 2) * 25 - 15;
            const armY = -Math.sin(p.windUp * Math.PI) * 35 - 15;
            ctx.fillText('⚾', armX, armY);
        }

        ctx.restore();
    }

    function drawBatter() {
        const b = batter;

        ctx.save();

        // In batter's eye view, we see the bat from behind/side
        // Position bat in lower portion of screen
        ctx.translate(150, 420);

        // Swing animation - bat swings across the screen
        let batAngle = -0.8; // Ready position (tilted back)
        if (b.swinging) {
            // Swing from right to left across screen
            batAngle = -0.8 + b.swingFrame * 0.25;
        }

        ctx.rotate(batAngle);

        // Bat (larger since it's in foreground)
        // Bat barrel (top)
        ctx.fillStyle = '#D2691E';
        ctx.beginPath();
        ctx.ellipse(0, -120, 20, 35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5a3010';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Bat handle
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(-8, -90, 16, 100);
        ctx.strokeStyle = '#5a3010';
        ctx.lineWidth = 2;
        ctx.strokeRect(-8, -90, 16, 100);

        // Grip tape
        ctx.fillStyle = '#333';
        ctx.fillRect(-9, -10, 18, 25);

        ctx.restore();

        // Draw batter character icon in corner (shows who's batting)
        ctx.save();
        ctx.font = '35px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Batter portrait in bottom-left
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(50, 470, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillText(BATTERS[currentBatterIndex % BATTERS.length], 50, 470);
        ctx.restore();
    }

    function drawBall() {
        if (!ball.visible) return;

        // Get opacity (for fadeaway pitch)
        const opacity = ball.opacity !== undefined ? ball.opacity : 1;

        // Ball size based on depth (z position) - larger as it gets closer
        // ball.z goes from 0 (pitcher) to 1 (batter)
        const depth = ball.z || 0;
        const minSize = 8;
        const maxSize = 45;
        const ballSize = minSize + (maxSize - minSize) * depth;

        // Ball trail (smaller circles getting larger)
        ctx.save();
        ctx.globalAlpha = opacity * 0.4;
        for (let i = 0; i < ballTrail.length; i++) {
            const t = ballTrail[i];
            const trailDepth = t.z || 0;
            const trailSize = (minSize + (maxSize - minSize) * trailDepth) * 0.6;
            ctx.beginPath();
            ctx.arc(t.x, t.y, trailSize / 2, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + i * 0.05})`;
            ctx.fill();
        }
        ctx.restore();

        // Ball shadow on ground (moves with ball)
        ctx.save();
        ctx.globalAlpha = opacity * 0.25;
        ctx.fillStyle = 'rgba(0,0,0,1)';
        const shadowY = 460 - (1 - depth) * 200;  // Shadow gets closer to ball as it approaches
        const shadowSize = ballSize * 0.4;
        ctx.beginPath();
        ctx.ellipse(ball.x, shadowY, shadowSize, shadowSize * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Ball
        ctx.save();
        ctx.globalAlpha = opacity;

        // Draw actual baseball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballSize / 2, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#cc0000';
        ctx.lineWidth = Math.max(1, ballSize / 15);
        ctx.stroke();

        // Baseball stitching (simplified)
        if (ballSize > 15) {
            ctx.strokeStyle = '#cc0000';
            ctx.lineWidth = Math.max(1, ballSize / 20);
            // Left curve
            ctx.beginPath();
            ctx.arc(ball.x - ballSize * 0.2, ball.y, ballSize * 0.3, -0.5, 0.5);
            ctx.stroke();
            // Right curve
            ctx.beginPath();
            ctx.arc(ball.x + ballSize * 0.2, ball.y, ballSize * 0.3, Math.PI - 0.5, Math.PI + 0.5);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawHitResult() {
        if (hitResult.timer <= 0) return;

        ctx.save();
        ctx.globalAlpha = Math.min(1, hitResult.timer / 30);

        const scale = 1 + (60 - hitResult.timer) * 0.02;
        ctx.translate(hitResult.x, hitResult.y - (60 - hitResult.timer) * 2);
        ctx.scale(scale, scale);

        ctx.font = 'bold 36px Comic Sans MS, cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Text outline
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.strokeText(hitResult.text, 0, 0);

        // Text fill
        let color = '#fff';
        if (hitResult.text.includes('HOME RUN')) color = '#ffd700';
        else if (hitResult.text.includes('TRIPLE')) color = '#c0c0c0';
        else if (hitResult.text.includes('DOUBLE')) color = '#cd7f32';
        else if (hitResult.text.includes('SINGLE')) color = '#90EE90';
        else if (hitResult.text.includes('OUT') || hitResult.text.includes('STRIKE')) color = '#ff6b6b';

        ctx.fillStyle = color;
        ctx.fillText(hitResult.text, 0, 0);

        ctx.restore();
    }

    function drawBatterLineup() {
        // On-deck batters shown in top-right corner
        const startX = 720;
        const startY = 80;

        ctx.save();

        // Background panel
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(startX - 70, startY - 35, 140, 75, 10);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ON DECK', startX, startY - 20);

        for (let i = 1; i < 4; i++) {
            const idx = (currentBatterIndex + i) % BATTERS.length;

            ctx.save();
            ctx.translate(startX - 35 + (i - 1) * 35, startY + 15);

            // Circle background
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Batter emoji
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(BATTERS[idx], 0, 0);

            ctx.restore();
        }

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawField();
        drawPitcher();
        drawBatter();
        drawBall();
        drawHitResult();
        drawBatterLineup();
    }

    // ==================== GAME LOGIC ====================
    function pitch() {
        if (gameState !== 'playing') return;

        // Randomly select pitch type (weighted - fastballs more common early, more variety later)
        const pitchTypes = ['fastball', 'fastball', 'slowball', 'zigzag', 'highArc', 'loopdeloop', 'fadeaway'];
        currentPitch = pitchTypes[Math.floor(Math.random() * pitchTypes.length)];

        gameState = 'pitching';
        pitcher.throwing = true;
        pitcher.windUp = 0;
        batter.canSwing = false;

        // Wind-up animation
        const windUpAnim = setInterval(() => {
            pitcher.windUp += 0.05;
            if (pitcher.windUp >= 1) {
                clearInterval(windUpAnim);
                throwBall();
            }
        }, 30);
    }

    function throwBall() {
        // Ball starts at pitcher (center screen, in distance)
        ball.x = 400;           // Center horizontally
        ball.y = 230;           // At pitcher's height
        ball.z = 0;             // Far away (depth: 0 = pitcher, 1 = batter)
        ball.visible = true;
        ball.hit = false;
        ball.opacity = 1;
        ballTrail = [];
        pitchTime = 0;

        // Get pitch properties
        const pitchData = PITCH_TYPES[currentPitch];

        // Speed is how fast the ball comes toward batter (z velocity)
        const speed = pitchData.speed;
        ball.vz = speed * 0.012;  // Convert to z units

        // Initial trajectory - mostly straight at batter
        ball.vx = 0;
        ball.vy = 0;

        // Target position for strike zone (center)
        ball.targetX = 400;
        ball.targetY = 390;

        // Store base positions for special pitches
        ball.baseX = ball.x;
        ball.baseY = ball.y;
        ball.startZ = 0;

        // Store pitch type for special movement
        ball.pitchType = pitchData.type;

        // High arc pitch starts going up
        if (pitchData.type === 'highArc') {
            ball.vy = -3;  // Go up first
        }

        gameState = 'batting';
        batter.canSwing = true;
        pitcher.throwing = false;

        playSound('throw');
    }

    function swing() {
        if (gameState !== 'batting' || !batter.canSwing || batter.swinging) return;

        batter.swinging = true;
        batter.swingFrame = 0;
        batter.canSwing = false;

        playSound('swing');

        // Check if ball is in hitting zone based on z-depth
        // Sweet spot is when ball is at z between 0.75 and 0.95
        const zInRange = ball.z >= 0.65 && ball.z <= 0.98;

        // Also check if ball is within strike zone area (x/y on screen)
        const xInRange = ball.x > 280 && ball.x < 520;
        const yInRange = ball.y > 300 && ball.y < 450;

        const inZone = ball.visible && zInRange && xInRange && yInRange;

        if (inZone) {
            // Calculate hit quality based on timing (z position)
            // Perfect hit is around z = 0.85
            const perfectZ = 0.85;
            const zDiff = Math.abs(ball.z - perfectZ);
            const timingQuality = 1 - (zDiff / 0.2);  // 0 to 1 based on timing

            // Also factor in position (center is better)
            const centerX = 400;
            const centerY = 375;
            const positionQuality = 1 - (Math.sqrt(
                Math.pow(ball.x - centerX, 2) + Math.pow(ball.y - centerY, 2)
            ) / 100);

            const hitQuality = (timingQuality * 0.7 + positionQuality * 0.3);

            hitBall(Math.max(0.1, Math.min(1, hitQuality)));
        } else if (ball.visible && ball.z < 0.98) {
            // Swing and miss (ball not close enough yet or outside zone)
            // Don't call strike yet - let the ball pass naturally
        }

        // Swing animation
        const swingAnim = setInterval(() => {
            batter.swingFrame++;
            if (batter.swingFrame > 12) {
                clearInterval(swingAnim);
                batter.swinging = false;
                batter.swingFrame = 0;
            }
        }, 25);
    }

    function hitBall(quality) {
        ball.hit = true;
        ball.opacity = 1;  // Reset opacity in case it was a fadeaway
        gameState = 'hit';

        // Determine hit type based on quality
        const rand = Math.random();
        const power = quality * 0.7 + rand * 0.3;

        let hitType, points, resultText;

        if (power > 0.85) {
            hitType = 'homerun';
            points = 100;
            resultText = '💥 HOME RUN! 💥';
            stats.homeRuns++;
            stats.hits++;
        } else if (power > 0.7) {
            hitType = 'triple';
            points = 50;
            resultText = 'TRIPLE!';
            stats.hits++;
        } else if (power > 0.5) {
            hitType = 'double';
            points = 25;
            resultText = 'DOUBLE!';
            stats.hits++;
        } else if (power > 0.3) {
            hitType = 'single';
            points = 10;
            resultText = 'SINGLE!';
            stats.hits++;
        } else {
            hitType = 'out';
            points = 0;
            resultText = 'OUT!';
            outs++;
        }

        // Set ball trajectory - ball flies away (toward outfield)
        // Randomize direction slightly
        const hitDirection = (Math.random() - 0.5) * 2;  // -1 to 1

        if (hitType === 'homerun') {
            ball.vx = hitDirection * 8;
            ball.vy = -15 - Math.random() * 5;
            playSound('homerun');
        } else if (hitType !== 'out') {
            ball.vx = hitDirection * 5;
            ball.vy = -8 - power * 6;
            playSound('hit');
        } else {
            ball.vx = hitDirection * 3;
            ball.vy = -3 - Math.random() * 2;
            playSound('out');
        }

        // Update score
        score += points;
        document.getElementById('score').textContent = score;
        document.getElementById('outs').textContent = outs;

        // Show result
        hitResult.text = resultText;
        hitResult.timer = 60;
        hitResult.x = 400;
        hitResult.y = 200;

        // Next batter or game over
        setTimeout(() => {
            if (outs >= 3) {
                endGame();
            } else {
                if (hitType !== 'out') {
                    currentBatterIndex++;
                }
                nextPitch();
            }
        }, hitType === 'homerun' ? 2000 : 1200);
    }

    function strike() {
        stats.strikes++;

        hitResult.text = 'STRIKE!';
        hitResult.timer = 40;
        hitResult.x = 400;
        hitResult.y = 250;

        playSound('strike');

        // 3 strikes = out
        if (stats.strikes >= 3) {
            stats.strikes = 0;
            outs++;
            document.getElementById('outs').textContent = outs;

            setTimeout(() => {
                hitResult.text = 'STRIKE OUT!';
                hitResult.timer = 50;

                setTimeout(() => {
                    if (outs >= 3) {
                        endGame();
                    } else {
                        currentBatterIndex++;
                        nextPitch();
                    }
                }, 800);
            }, 300);
        } else {
            setTimeout(nextPitch, 800);
        }
    }

    function nextPitch() {
        ball.visible = false;
        ball.hit = false;
        ballTrail = [];
        gameState = 'playing';

        // Random delay before next pitch
        pitchTimer = setTimeout(pitch, 1000 + Math.random() * 500);
    }

    function update() {
        // Update ball
        if (ball.visible) {
            pitchTime++;

            // Add to trail with z position
            ballTrail.push({ x: ball.x, y: ball.y, z: ball.z });
            if (ballTrail.length > 8) ballTrail.shift();

            // Apply special pitch physics (only when not hit)
            if (!ball.hit) {
                // Move ball toward batter (increase z)
                ball.z += ball.vz;

                // Calculate screen position based on z (perspective)
                // As z increases, ball moves from center toward strike zone
                const progress = ball.z;  // 0 to 1

                // Base movement toward strike zone
                ball.x = ball.baseX + (ball.targetX - ball.baseX) * progress * 0.3;
                ball.y = ball.baseY + (ball.targetY - ball.baseY) * progress;

                // Apply pitch-specific movement
                switch (ball.pitchType) {
                    case 'zigzag':
                        // Yellow - zigzag side to side
                        const zigzagAmp = 60 * (1 - progress * 0.5); // Less amplitude as it gets closer
                        ball.x += Math.sin(pitchTime * 0.25) * zigzagAmp;
                        break;

                    case 'highArc':
                        // Blue - arcs up then down
                        ball.vy += 0.4;  // Gravity
                        ball.y += ball.vy;
                        break;

                    case 'loop':
                        // Green - loop-de-loops
                        const loopRadius = 40 * (1 - progress * 0.6);
                        const loopSpeed = 0.2;
                        ball.x += Math.sin(pitchTime * loopSpeed) * loopRadius * 0.15;
                        ball.y += Math.cos(pitchTime * loopSpeed * 2) * loopRadius * 0.1;
                        break;

                    case 'fade':
                        // Purple - fades out as it approaches
                        if (ball.z > 0.5) {
                            ball.opacity = Math.max(0.05, 1 - (ball.z - 0.5) * 2);
                        }
                        break;

                    case 'straight':
                    default:
                        // Red (fast) and White (slow) - straight pitch
                        // No additional movement
                        break;
                }
            } else {
                // Ball was hit - flies away from screen (z decreases, y goes up)
                ball.z -= 0.03;
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.3;  // Gravity
            }

            // Ball reached batter without being hit
            if (!ball.hit && ball.z >= 1) {
                ball.visible = false;
                strike();
            }

            // Ball off screen (after hit)
            if (ball.hit && (ball.z < -0.5 || ball.y > 550 || ball.y < -100)) {
                ball.visible = false;
            }
        }

        // Update hit result timer
        if (hitResult.timer > 0) {
            hitResult.timer--;
        }
    }

    function gameLoop() {
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // ==================== SOUND ====================
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            switch(type) {
                case 'throw':
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                    break;
                case 'swing':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                    break;
                case 'hit':
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                    break;
                case 'homerun':
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                    // Crowd cheer
                    setTimeout(() => {
                        const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
                        const noise = ctx2.createOscillator();
                        const g = ctx2.createGain();
                        noise.type = 'sawtooth';
                        noise.frequency.setValueAtTime(200, ctx2.currentTime);
                        noise.connect(g);
                        g.connect(ctx2.destination);
                        g.gain.setValueAtTime(0.1, ctx2.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx2.currentTime + 0.8);
                        noise.start(); noise.stop(ctx2.currentTime + 0.8);
                    }, 200);
                    break;
                case 'strike':
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                    break;
                case 'out':
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                    break;
            }
        } catch(e) {}
    }

    // ==================== GAME FLOW ====================
    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('instructions').style.display = 'block';

        score = 0;
        outs = 0;
        currentBatterIndex = 0;
        stats = { hits: 0, homeRuns: 0, strikes: 0 };
        ball.visible = false;
        ballTrail = [];
        hitResult.timer = 0;

        document.getElementById('score').textContent = '0';
        document.getElementById('outs').textContent = '0';

        gameState = 'playing';

        if (!gameLoopId) {
            gameLoop();
        }

        setTimeout(pitch, 1500);
    }

    function endGame() {
        gameState = 'gameOver';
        clearTimeout(pitchTimer);

        // Calculate coins
        const coinsEarned = Math.floor(score / 5) + stats.homeRuns * 10;
        saveData.coins += coinsEarned;
        saveData.gamesPlayed++;
        saveData.totalHomeRuns += stats.homeRuns;

        // Check for new record
        const isNewRecord = score > saveData.bestScore;
        if (isNewRecord) {
            saveData.bestScore = score;
        }

        save();
        updateUI();

        // Show game over screen
        document.getElementById('finalScore').textContent = score;
        document.getElementById('statHR').textContent = stats.homeRuns;
        document.getElementById('statHits').textContent = stats.hits;
        document.getElementById('coinsEarned').textContent = coinsEarned;

        if (isNewRecord) {
            document.getElementById('newRecord').classList.remove('hidden');
        } else {
            document.getElementById('newRecord').classList.add('hidden');
        }

        document.getElementById('instructions').style.display = 'none';
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function showMenu() {
        gameState = 'menu';
        clearTimeout(pitchTimer);
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
    }

    // ==================== INPUT ====================
    canvas.addEventListener('click', () => {
        if (gameState === 'batting') {
            swing();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState === 'batting') {
                swing();
            } else if (gameState === 'menu') {
                startGame();
            }
        }
    });

    // Prevent double-tap zoom on mobile
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (gameState === 'batting') {
            swing();
        }
    });

    // ==================== INIT ====================
    loadUser();
    draw();
    </script>
</body>
</html>
