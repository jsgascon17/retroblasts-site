<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSBG7067J2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZSBG7067J2');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RetroBlasts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ffd700; margin-bottom: 20px; }
        
        .login-box {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
            border: 2px solid #ffd700;
        }
        .login-box h2 { color: #ffd700; margin-bottom: 25px; font-size: 1.8rem; }
        
        input {
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #444;
            font-size: 1rem;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            color: #fff;
            width: 100%;
            max-width: 280px;
        }
        input:focus { border-color: #ffd700; outline: none; }
        input::placeholder { color: #888; }
        
        button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
        }
        button:hover { transform: scale(1.03); }
        button.secondary { background: #444; color: #fff; }
        button.danger { background: #c00; color: #fff; }
        
        .hidden { display: none !important; }
        
        .admin-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 30px;
        }
        
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .user-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
        }
        .user-card h3 { color: #ffd700; margin-bottom: 10px; }
        .user-card p { color: #aaa; margin: 5px 0; font-size: 0.9rem; }
        .user-card button { margin-top: 10px; padding: 10px 20px; }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .message.success { background: rgba(0,200,0,0.2); color: #4f4; border: 1px solid #4f4; }
        .message.error { background: rgba(200,0,0,0.2); color: #f66; border: 1px solid #f66; }
        
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1a1a2e;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-box h3 { color: #ffd700; margin-bottom: 20px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login -->
        <div class="login-box" id="loginBox">
            <h2>🔐 Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <br>
            <button onclick="doLogin()">Login</button>
            <div id="loginMsg"></div>
        </div>
        
        <!-- Admin Panel -->
        <div class="admin-panel hidden" id="adminPanel">
            <div class="header-bar">
                <h1>🛠️ Admin Panel</h1>
                <button class="danger" onclick="location.reload()">Logout</button>
            </div>
            
            <div id="adminMsg"></div>
            
            <h2 style="color:#ffd700;">All Users</h2>
            <div class="user-grid" id="userGrid">Loading...</div>
        </div>
    </div>
    
    <!-- Reset Modal -->
    <div class="modal hidden" id="resetModal">
        <div class="modal-box">
            <h3>Reset Password</h3>
            <p style="color:#aaa;margin-bottom:15px;">User: <strong id="modalUser" style="color:#fff;"></strong></p>
            <input type="password" id="newPass" placeholder="New Password (min 4 chars)">
            <br>
            <button onclick="doReset()">Reset Password</button>
            <button class="secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>
    
    <script>
        let resetUser = null;
        
        async function doLogin() {
            const pass = document.getElementById('adminPass').value;
            
            const resp = await fetch('api/admin.php', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'login', password: pass})
            });
            const data = await resp.json();
            
            if (data.success) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadUsers();
            } else {
                document.getElementById('loginMsg').innerHTML = '<div class="message error">' + data.error + '</div>';
            }
        }
        
        async function loadUsers() {
            const resp = await fetch('api/admin.php', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'listUsers'})
            });
            const data = await resp.json();
            
            if (data.success) {
                const grid = document.getElementById('userGrid');
                grid.innerHTML = data.users.map(u => `
                    <div class="user-card">
                        <h3>${u.displayName}</h3>
                        <p>Username: <strong>${u.username}</strong></p>
                        <p>🪙 ${u.coins.toLocaleString()} coins</p>
                        <p>⭐ ${u.xp.toLocaleString()} XP</p>
                        <button onclick="openReset('${u.username}')">Reset Password</button>
                    </div>
                `).join('');
            } else {
                document.getElementById('adminMsg').innerHTML = '<div class="message error">' + data.error + '</div>';
            }
        }
        
        function openReset(username) {
            resetUser = username;
            document.getElementById('modalUser').textContent = username;
            document.getElementById('newPass').value = '';
            document.getElementById('resetModal').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('resetModal').classList.add('hidden');
        }
        
        async function doReset() {
            const newPass = document.getElementById('newPass').value;
            if (newPass.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            
            const resp = await fetch('api/admin.php', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'resetPassword', username: resetUser, newPassword: newPass})
            });
            const data = await resp.json();
            
            if (data.success) {
                closeModal();
                document.getElementById('adminMsg').innerHTML = '<div class="message success">Password reset for ' + resetUser + '!</div>';
            } else {
                alert(data.error);
            }
        }
        
        document.getElementById('adminPass').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
