<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Play Slice Master 3D online free! Flip your knife through obstacles and slice everything in your path.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Master 3D - Free Online Game | RetroBlasts</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #87CEEB;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #gameContainer { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            padding: 10px 20px; border-radius: 25px; cursor: pointer;
            font-size: 1em; z-index: 100;
        }
        .back-btn:hover { background: rgba(0,0,0,0.8); }

        .ui-overlay {
            position: fixed; top: 20px; right: 20px;
            z-index: 100; text-align: right;
        }
        .score-display {
            font-size: 3em; font-weight: bold;
            color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .coins-display {
            font-size: 1.3em; color: #ffd700; margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
        }
        .hidden { display: none !important; }

        .title {
            font-size: 4em; font-weight: bold; margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1.5em; color: #888; margin-bottom: 40px; }

        .btn {
            padding: 15px 50px; font-size: 1.3em; font-weight: bold;
            border: none; border-radius: 30px; cursor: pointer;
            margin: 10px; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff; box-shadow: 0 5px 20px rgba(255,107,107,0.4);
        }
        .btn-primary:hover { transform: translateY(-3px); }
        .btn-secondary {
            background: linear-gradient(135deg, #4ecdc4, #3db9b1);
            color: #fff;
        }
        .btn-shop {
            background: linear-gradient(135deg, #ffd700, #ffb700);
            color: #000;
        }

        .instructions { color: #aaa; margin-top: 30px; font-size: 1.1em; }
        .final-score { font-size: 5em; font-weight: bold; color: #ffd700; margin: 20px 0; }
        .high-score-text { color: #4ecdc4; font-size: 1.3em; margin-bottom: 20px; }
        .new-high-score { color: #ff6b6b; font-size: 1.5em; animation: pulse 0.5s ease-in-out infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .knife-select {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 15px; max-width: 500px; margin: 30px 0;
        }
        .knife-option {
            width: 80px; height: 100px; background: rgba(255,255,255,0.1);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s;
        }
        .knife-option:hover { background: rgba(255,255,255,0.2); }
        .knife-option.selected { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .knife-option.locked { opacity: 0.4; }
        .knife-icon { font-size: 2em; margin-bottom: 5px; }
        .knife-name { font-size: 0.7em; color: #aaa; }
        .knife-price { font-size: 0.8em; color: #ffd700; }

        .score-popup {
            position: fixed; pointer-events: none; z-index: 150;
            font-size: 2em; font-weight: bold; color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        .multiplier-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 5em; font-weight: bold; color: #ffd700; z-index: 150;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            animation: multiplierPop 1.2s ease-out forwards;
        }
        @keyframes multiplierPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(-80px); }
        }

        .tap-hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            font-size: 1.5em; color: rgba(255,255,255,0.6); z-index: 50;
            animation: tapBounce 1s ease-in-out infinite;
        }
        @keyframes tapBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-15px); }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='index.html'">← Back</button>

    <div id="gameContainer"></div>

    <div class="ui-overlay">
        <div class="score-display" id="scoreDisplay">0</div>
        <div class="coins-display">🪙 <span id="coinsDisplay">0</span></div>
    </div>

    <div class="tap-hint hidden" id="tapHint">TAP TO FLIP</div>

    <!-- Start Screen -->
    <div class="overlay" id="startScreen">
        <div class="title">SLICE MASTER</div>
        <div class="subtitle">Flip & Slice Everything!</div>
        <button class="btn btn-primary" onclick="startGame()">PLAY</button>
        <button class="btn btn-shop" onclick="showShop()">🔪 KNIVES</button>
        <div class="instructions">Tap or click to flip your knife</div>
        <div class="instructions" style="margin-top:10px; color:#ff69b4;">Avoid pink obstacles!</div>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="gameOverScreen">
        <div class="title" style="font-size:2.5em;">GAME OVER</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="high-score-text">Best: <span id="highScoreDisplay">0</span></div>
        <div class="new-high-score hidden" id="newHighScore">🏆 NEW BEST!</div>
        <div class="coins-display" style="font-size:1.5em; margin:20px 0;">
            +<span id="coinsEarned">0</span> coins
        </div>
        <button class="btn btn-primary" onclick="startGame()">PLAY AGAIN</button>
        <button class="btn btn-secondary" onclick="showStart()">MENU</button>
    </div>

    <!-- Shop Screen -->
    <div class="overlay hidden" id="shopScreen">
        <div class="title" style="font-size:2.5em;">🔪 KNIVES</div>
        <div class="coins-display" style="font-size:1.5em;">🪙 <span id="shopCoins">0</span></div>
        <div class="knife-select" id="knifeSelect"></div>
        <button class="btn btn-secondary" onclick="showStart()">BACK</button>
    </div>

    <script>
        // Knives config
        const KNIVES = [
            { id: 'basic', name: 'Basic', icon: '🔪', color: 0xcccccc, price: 0 },
            { id: 'cleaver', name: 'Cleaver', icon: '🪓', color: 0x666666, price: 500 },
            { id: 'katana', name: 'Katana', icon: '⚔️', color: 0x4ecdc4, price: 1500 },
            { id: 'golden', name: 'Golden', icon: '🗡️', color: 0xffd700, price: 3000 },
            { id: 'flame', name: 'Flame', icon: '🔥', color: 0xff4444, price: 5000 },
            { id: 'ice', name: 'Ice', icon: '❄️', color: 0x44aaff, price: 5000 },
            { id: 'rainbow', name: 'Rainbow', icon: '🌈', color: 0xff00ff, price: 10000 },
            { id: 'diamond', name: 'Diamond', icon: '💎', color: 0x00ffff, price: 25000 }
        ];

        // Save system
        let saveData = {
            coins: 0, highScore: 0,
            ownedKnives: ['basic'], equippedKnife: 'basic'
        };

        let currentUsername = null;
        function getSaveKey() {
            return currentUsername ? `sliceMaster_${currentUsername}` : 'sliceMaster_guest';
        }

        async function checkUser() {
            try {
                const r = await fetch('api/auth.php?action=check', { credentials: 'include' });
                const d = await r.json();
                if (d.loggedIn && d.user) {
                    currentUsername = d.user.username;
                    localStorage.setItem('arcadeUser', JSON.stringify(d.user));
                }
            } catch (e) {
                const cached = localStorage.getItem('arcadeUser');
                if (cached) currentUsername = JSON.parse(cached).username;
            }
            loadSave();
            updateUI();
        }

        function loadSave() {
            const s = localStorage.getItem(getSaveKey());
            if (s) saveData = { ...saveData, ...JSON.parse(s) };
        }

        function save() {
            localStorage.setItem(getSaveKey(), JSON.stringify(saveData));
        }

        function updateUI() {
            document.getElementById('coinsDisplay').textContent = saveData.coins.toLocaleString();
            document.getElementById('shopCoins').textContent = saveData.coins.toLocaleString();
            document.getElementById('highScoreDisplay').textContent = saveData.highScore.toLocaleString();
        }

        // Three.js
        let scene, camera, renderer;
        let knife;
        let gameObjects = [];
        let particles = [];

        // Game state
        let gameRunning = false;
        let score = 0;
        let knifeY = 0;
        let knifeVelY = 0;
        let knifeRotation = 0;
        let knifeRotationVel = 0;
        let worldX = 0;
        let currentLevel = 1;

        const GRAVITY = -0.025;
        const FLIP_POWER = 0.55;
        const MOVE_SPEED = 0.25;
        const KNIFE_SPIN = 0.2;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Orthographic camera for side view
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 12;
            camera = new THREE.OrthographicCamera(
                -viewSize * aspect, viewSize * aspect,
                viewSize, -viewSize,
                0.1, 1000
            );
            camera.position.set(0, 5, 20);
            camera.lookAt(0, 5, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('gameContainer').appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(5, 15, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(2000, 20);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x90EE90 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);

            // Sky gradient (back plane)
            const skyGeo = new THREE.PlaneGeometry(2000, 50);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            sky.position.set(0, 20, -10);
            scene.add(sky);

            // Create knife
            createKnife();

            // Events
            window.addEventListener('resize', onResize);
            window.addEventListener('mousedown', onTap);
            window.addEventListener('touchstart', onTap);
            window.addEventListener('keydown', e => { if (e.code === 'Space') onTap(e); });

            animate();
        }

        function createKnife() {
            if (knife) scene.remove(knife);

            const group = new THREE.Group();
            const equipped = KNIVES.find(k => k.id === saveData.equippedKnife) || KNIVES[0];

            // Blade (flat, pointing down initially)
            const bladeGeo = new THREE.BoxGeometry(0.2, 2.5, 0.8);
            const bladeMat = new THREE.MeshStandardMaterial({
                color: equipped.color, metalness: 0.9, roughness: 0.1
            });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 1.25;
            blade.castShadow = true;
            group.add(blade);

            // Sharp edge
            const edgeGeo = new THREE.BoxGeometry(0.05, 2.5, 0.2);
            const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1 });
            const edge = new THREE.Mesh(edgeGeo, edgeMat);
            edge.position.set(0.12, 1.25, 0);
            group.add(edge);

            // Handle
            const handleGeo = new THREE.BoxGeometry(0.3, 1.2, 0.9);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -0.6;
            handle.castShadow = true;
            group.add(handle);

            group.position.set(0, 8, 0);
            scene.add(group);
            knife = group;
        }

        function generateLevel() {
            // Clear old objects
            gameObjects.forEach(obj => scene.remove(obj.mesh));
            gameObjects = [];

            const levelLength = 150 + currentLevel * 30;
            let x = 10;

            while (x < levelLength) {
                const sectionType = Math.random();

                if (sectionType < 0.4) {
                    // Ground objects to slice
                    const count = 1 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++) {
                        createSliceable(x + i * 2, 0);
                    }
                    x += count * 2 + 3;
                } else if (sectionType < 0.6) {
                    // Floating fruits
                    const height = 4 + Math.random() * 6;
                    createSliceable(x, height);
                    if (Math.random() > 0.5) createSliceable(x + 2, height + 2);
                    x += 5;
                } else if (sectionType < 0.75) {
                    // Tower to slice
                    createTower(x);
                    x += 4;
                } else if (sectionType < 0.9) {
                    // Obstacle (pink danger)
                    createObstacle(x, Math.random() > 0.5 ? 0 : 3 + Math.random() * 4);
                    x += 4;
                } else {
                    // Platform with items
                    createPlatform(x);
                    x += 8;
                }
            }

            // End multipliers
            createMultipliers(levelLength + 5);
        }

        function createSliceable(x, baseY) {
            const types = [
                { geo: new THREE.SphereGeometry(0.7, 16, 16), color: 0xff0000, points: 100 }, // Apple
                { geo: new THREE.SphereGeometry(0.6, 16, 16), color: 0xffa500, points: 100 }, // Orange
                { geo: new THREE.SphereGeometry(0.5, 16, 16), color: 0x00ff00, points: 100 }, // Lime
                { geo: new THREE.BoxGeometry(1, 1, 1), color: 0xffff00, points: 120 }, // Block
                { geo: new THREE.CylinderGeometry(0.5, 0.5, 1, 16), color: 0x8B4513, points: 150 } // Log
            ];

            const type = types[Math.floor(Math.random() * types.length)];
            const mat = new THREE.MeshStandardMaterial({ color: type.color });
            const mesh = new THREE.Mesh(type.geo, mat);

            const y = baseY === 0 ? type.geo.parameters.radius || 0.5 : baseY;
            mesh.position.set(x, y + 0.5, 0);
            mesh.castShadow = true;

            scene.add(mesh);
            gameObjects.push({ mesh, type: 'sliceable', points: type.points, radius: 1 });
        }

        function createTower(x) {
            const height = 3 + Math.random() * 4;
            const geo = new THREE.BoxGeometry(1.5, height, 1.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0xCD853F });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height / 2, 0);
            mesh.castShadow = true;

            scene.add(mesh);
            gameObjects.push({ mesh, type: 'sliceable', points: 200, radius: 1.5, isLarge: true });
        }

        function createObstacle(x, y) {
            const height = 1.5 + Math.random() * 2;
            const geo = new THREE.BoxGeometry(1.2, height, 1.2);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xff69b4, emissive: 0xff1493, emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y === 0 ? height / 2 : y, 0);
            mesh.castShadow = true;

            scene.add(mesh);
            gameObjects.push({ mesh, type: 'obstacle', radius: 1.2 });
        }

        function createPlatform(x) {
            // Platform
            const platGeo = new THREE.BoxGeometry(6, 0.5, 2);
            const platMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const plat = new THREE.Mesh(platGeo, platMat);
            plat.position.set(x + 3, 4, 0);
            plat.castShadow = true;
            scene.add(plat);
            gameObjects.push({ mesh: plat, type: 'platform', radius: 0 });

            // Items on platform
            for (let i = 0; i < 3; i++) {
                const geo = new THREE.SphereGeometry(0.5, 16, 16);
                const colors = [0xff0000, 0x00ff00, 0xffff00];
                const mat = new THREE.MeshStandardMaterial({ color: colors[i] });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x + 1 + i * 2, 5, 0);
                mesh.castShadow = true;
                scene.add(mesh);
                gameObjects.push({ mesh, type: 'sliceable', points: 100, radius: 0.7 });
            }
        }

        function createMultipliers(x) {
            const mults = [
                { value: 2, color: 0x4CAF50, y: 2 },
                { value: 3, color: 0x2196F3, y: 5 },
                { value: 5, color: 0x9C27B0, y: 8 },
                { value: 10, color: 0xFFD700, y: 11 }
            ];

            mults.forEach(m => {
                const geo = new THREE.BoxGeometry(4, 2, 1);
                const mat = new THREE.MeshStandardMaterial({
                    color: m.color, emissive: m.color, emissiveIntensity: 0.3
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, m.y, 0);

                // Add text (simple approach - could use sprites)
                scene.add(mesh);
                gameObjects.push({ mesh, type: 'multiplier', value: m.value, radius: 2 });
            });
        }

        function createParticles(position, color) {
            for (let i = 0; i < 8; i++) {
                const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const mat = new THREE.MeshBasicMaterial({ color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);

                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    Math.random() * 0.4,
                    (Math.random() - 0.5) * 0.2
                );

                scene.add(mesh);
                particles.push({ mesh, vel, life: 40 });
            }
        }

        function showScorePopup(points, x, y) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+' + points;

            // Convert 3D position to screen
            const vec = new THREE.Vector3(x, y, 0);
            vec.project(camera);
            popup.style.left = ((vec.x + 1) / 2 * window.innerWidth) + 'px';
            popup.style.top = ((-vec.y + 1) / 2 * window.innerHeight) + 'px';

            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function showMultiplier(value) {
            const popup = document.createElement('div');
            popup.className = 'multiplier-popup';
            popup.textContent = 'x' + value + '!';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1200);
        }

        function onTap(e) {
            e.preventDefault();
            if (!gameRunning) return;

            knifeVelY = FLIP_POWER;
            knifeRotationVel = KNIFE_SPIN;

            // Sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 600;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function checkCollisions() {
            const knifePos = knife.position;
            const knifeRadius = 1.2;

            for (let i = gameObjects.length - 1; i >= 0; i--) {
                const obj = gameObjects[i];
                const objPos = obj.mesh.position;
                const dist = knifePos.distanceTo(objPos);

                if (dist < knifeRadius + obj.radius) {
                    if (obj.type === 'sliceable') {
                        // Sliced!
                        score += obj.points;
                        document.getElementById('scoreDisplay').textContent = score.toLocaleString();

                        createParticles(objPos.clone(), obj.mesh.material.color.getHex());
                        showScorePopup(obj.points, objPos.x, objPos.y);

                        scene.remove(obj.mesh);
                        gameObjects.splice(i, 1);

                        // Sound
                        try {
                            const ctx = new (window.AudioContext || window.webkitAudioContext)();
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.type = 'sawtooth';
                            osc.frequency.value = 300 + Math.random() * 200;
                            gain.gain.setValueAtTime(0.15, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.12);
                        } catch (e) {}

                    } else if (obj.type === 'obstacle') {
                        gameOver();
                        return;

                    } else if (obj.type === 'multiplier') {
                        score *= obj.value;
                        document.getElementById('scoreDisplay').textContent = score.toLocaleString();
                        showMultiplier(obj.value);

                        scene.remove(obj.mesh);
                        gameObjects.splice(i, 1);

                        // Level complete
                        setTimeout(() => {
                            if (gameRunning) {
                                currentLevel++;
                                worldX = 0;
                                knife.position.set(0, 8, 0);
                                knifeVelY = 0;
                                knifeRotation = 0;
                                generateLevel();
                            }
                        }, 1000);
                        return;
                    }
                }
            }

            // Ground collision
            if (knifePos.y < 1) {
                gameOver();
            }
        }

        function gameOver() {
            gameRunning = false;

            const earned = Math.floor(score / 10);
            saveData.coins += earned;

            if (score > saveData.highScore) {
                saveData.highScore = score;
                document.getElementById('newHighScore').classList.remove('hidden');
            } else {
                document.getElementById('newHighScore').classList.add('hidden');
            }

            save();
            updateUI();

            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('coinsEarned').textContent = earned.toLocaleString();
            document.getElementById('tapHint').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');

            // Sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('tapHint').classList.remove('hidden');

            score = 0;
            worldX = 0;
            currentLevel = 1;
            knifeY = 8;
            knifeVelY = 0;
            knifeRotation = 0;
            knifeRotationVel = 0;

            document.getElementById('scoreDisplay').textContent = '0';

            createKnife();
            knife.position.set(0, 8, 0);

            generateLevel();
            gameRunning = true;
        }

        function showStart() {
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('tapHint').classList.add('hidden');
            gameRunning = false;
        }

        function showShop() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.remove('hidden');
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('knifeSelect');
            container.innerHTML = '';

            KNIVES.forEach(k => {
                const owned = saveData.ownedKnives.includes(k.id);
                const equipped = saveData.equippedKnife === k.id;
                const canBuy = saveData.coins >= k.price;

                const div = document.createElement('div');
                div.className = 'knife-option' + (equipped ? ' selected' : '') + (!owned && !canBuy ? ' locked' : '');

                div.innerHTML = `
                    <div class="knife-icon">${k.icon}</div>
                    <div class="knife-name">${k.name}</div>
                    ${owned ? (equipped ? '<span style="color:#4ecdc4;font-size:0.7em;">EQUIPPED</span>' : '<span style="color:#888;font-size:0.7em;">OWNED</span>')
                           : `<div class="knife-price">${k.price}</div>`}
                `;

                div.onclick = () => {
                    if (owned) {
                        saveData.equippedKnife = k.id;
                    } else if (canBuy) {
                        saveData.coins -= k.price;
                        saveData.ownedKnives.push(k.id);
                        saveData.equippedKnife = k.id;
                    }
                    save();
                    updateUI();
                    renderShop();
                };

                container.appendChild(div);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning && knife) {
                // Physics
                knifeVelY += GRAVITY;
                knife.position.y += knifeVelY;

                // Rotation
                knifeRotation += knifeRotationVel;
                knifeRotationVel *= 0.96;
                knife.rotation.z = knifeRotation;

                // Move world (knife stays centered-ish, world moves left)
                worldX += MOVE_SPEED;

                // Update camera to follow
                camera.position.x = worldX;
                knife.position.x = worldX;

                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.mesh.position.add(p.vel);
                    p.vel.y -= 0.015;
                    p.mesh.rotation.x += 0.1;
                    p.mesh.rotation.y += 0.1;
                    p.life--;

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        particles.splice(i, 1);
                    }
                }

                checkCollisions();
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 12;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Init
        checkUser();
        init();
    </script>
</body>
</html>
