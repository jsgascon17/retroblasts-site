    <script>
        // Constants
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const LANE_WIDTH = 100;
        const NOTE_HEIGHT = 30;
        const HIT_Y = 440;
        const PERFECT_WINDOW = 25;
        const GREAT_WINDOW = 50;
        const GOOD_WINDOW = 80;

        // Game state
        let gameRunning = false;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let hits = { perfect: 0, great: 0, good: 0, miss: 0 };
        let notes = [];
        let currentSong = null;
        let songProgress = 0;
        let lastTime = 0;

        // Save data
        const SAVE_KEY = 'rhythmBlastSave';
        let saveData = {
            coins: 0,
            highScores: {},
            unlockedSongs: ['tutorial', 'easy1'],
            totalPlays: 0,
            bestGrade: {}
        };

        // Songs data
        const SONGS = [
            {
                id: 'tutorial',
                title: 'First Steps',
                artist: 'RetroBlasts',
                difficulty: 'easy',
                bpm: 100,
                icon: '🎹',
                notePattern: generatePattern(100, 60, 0.3)
            },
            {
                id: 'easy1',
                title: 'Neon Dreams',
                artist: 'SynthWave',
                difficulty: 'easy',
                bpm: 120,
                icon: '🌙',
                notePattern: generatePattern(120, 60, 0.4)
            },
            {
                id: 'medium1',
                title: 'Electric Rush',
                artist: 'ByteBeats',
                difficulty: 'medium',
                bpm: 140,
                icon: '⚡',
                notePattern: generatePattern(140, 60, 0.5),
                unlockScore: 5000
            },
            {
                id: 'medium2',
                title: 'Cyber City',
                artist: 'PixelPulse',
                difficulty: 'medium',
                bpm: 150,
                icon: '🏙️',
                notePattern: generatePattern(150, 60, 0.55),
                unlockScore: 10000
            },
            {
                id: 'hard1',
                title: 'Digital Storm',
                artist: 'GlitchCore',
                difficulty: 'hard',
                bpm: 170,
                icon: '🌩️',
                notePattern: generatePattern(170, 60, 0.65),
                unlockScore: 20000
            },
            {
                id: 'hard2',
                title: 'Overdrive',
                artist: 'NeonNinja',
                difficulty: 'hard',
                bpm: 180,
                icon: '🔥',
                notePattern: generatePattern(180, 60, 0.7),
                unlockScore: 35000
            },
            {
                id: 'extreme1',
                title: 'MAXIMUM',
                artist: '???',
                difficulty: 'extreme',
                bpm: 200,
                icon: '💀',
                notePattern: generatePattern(200, 60, 0.8),
                unlockScore: 50000
            }
        ];

        // Generate random note pattern
        function generatePattern(bpm, durationSec, density) {
            const pattern = [];
            const beatInterval = 60000 / bpm;
            const totalBeats = Math.floor(durationSec * 1000 / beatInterval);

            for (let i = 0; i < totalBeats; i++) {
                if (Math.random() < density) {
                    const lane = Math.floor(Math.random() * 4);
                    pattern.push({
                        time: i * beatInterval,
                        lane: lane
                    });
                    // Sometimes add double notes
                    if (Math.random() < density * 0.3) {
                        let lane2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
                        pattern.push({
                            time: i * beatInterval,
                            lane: lane2
                        });
                    }
                }
            }
            return pattern;
        }

        // Lane colors
        const LANE_COLORS = ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5'];

        // Load/Save
        function loadSave() {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) saveData = { ...saveData, ...JSON.parse(saved) };
            } catch (e) { console.error('Load error:', e); }
            updateCoinsDisplay();
        }

        function save() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        function updateCoinsDisplay() {
            document.getElementById('coinsDisplay').textContent = saveData.coins;
        }

        // Render song list
        function renderSongList() {
            const list = document.getElementById('songList');
            let totalScore = Object.values(saveData.highScores).reduce((a, b) => a + b, 0);

            list.innerHTML = SONGS.map(song => {
                const isUnlocked = saveData.unlockedSongs.includes(song.id) ||
                                   (song.unlockScore && totalScore >= song.unlockScore);
                const highScore = saveData.highScores[song.id] || 0;
                const grade = saveData.bestGrade[song.id] || '';

                if (isUnlocked && !saveData.unlockedSongs.includes(song.id)) {
                    saveData.unlockedSongs.push(song.id);
                    save();
                }

                return `
                    <div class="song-card ${isUnlocked ? '' : 'locked'} ${currentSong?.id === song.id ? 'selected' : ''}"
                         data-song="${song.id}" onclick="selectSong('${song.id}')">
                        <div class="song-icon">${song.icon}</div>
                        <div class="song-info">
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">${song.artist}</div>
                            ${highScore > 0 ? `<div style="font-size: 0.45rem; color: #ffd700; margin-top: 3px;">Best: ${highScore} ${grade}</div>` : ''}
                        </div>
                        <div class="song-difficulty ${song.difficulty}">${song.difficulty.toUpperCase()}</div>
                        ${!isUnlocked ? `<div style="font-size: 0.4rem; color: #ff006e;">🔒 ${song.unlockScore} pts</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectSong(songId) {
            currentSong = SONGS.find(s => s.id === songId);
            renderSongList();
        }

        // Start game
        function startGame() {
            if (!currentSong) {
                currentSong = SONGS[0];
            }

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');

            // Reset state
            gameRunning = true;
            score = 0;
            combo = 0;
            maxCombo = 0;
            hits = { perfect: 0, great: 0, good: 0, miss: 0 };
            songProgress = 0;
            notes = [];

            // Create notes from pattern
            currentSong.notePattern.forEach(n => {
                notes.push({
                    lane: n.lane,
                    y: -NOTE_HEIGHT - (n.time / 5), // Convert time to starting Y position
                    time: n.time,
                    hit: false,
                    missed: false
                });
            });

            updateDisplay();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Game loop
        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            songProgress += deltaTime;

            // Clear canvas
            ctx.fillStyle = 'rgba(10, 10, 26, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw lane lines
            for (let i = 1; i < 4; i++) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.moveTo(i * LANE_WIDTH, 0);
                ctx.lineTo(i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }

            // Draw hit line glow
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, HIT_Y - 20, canvas.width, 40);

            // Update and draw notes
            let activeNotes = 0;
            notes.forEach(note => {
                if (note.hit || note.missed) return;

                // Move note down
                note.y += deltaTime * 0.4; // Speed

                // Check if missed
                if (note.y > HIT_Y + GOOD_WINDOW) {
                    note.missed = true;
                    hits.miss++;
                    combo = 0;
                    showFeedback('MISS', 'miss');
                    updateDisplay();
                    return;
                }

                // Draw note
                const x = note.lane * LANE_WIDTH + 10;
                const gradient = ctx.createLinearGradient(x, note.y, x + LANE_WIDTH - 20, note.y + NOTE_HEIGHT);
                gradient.addColorStop(0, LANE_COLORS[note.lane]);
                gradient.addColorStop(1, LANE_COLORS[note.lane] + '88');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(x, note.y, LANE_WIDTH - 20, NOTE_HEIGHT, 8);
                ctx.fill();

                // Glow effect
                ctx.shadowColor = LANE_COLORS[note.lane];
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;

                activeNotes++;
            });

            // Check if song ended
            if (activeNotes === 0 && notes.every(n => n.hit || n.missed)) {
                endGame();
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        // Handle key press
        function handleKeyPress(lane) {
            if (!gameRunning) return;

            // Visual feedback
            const keyIds = ['keyD', 'keyF', 'keyJ', 'keyK'];
            const keyEl = document.getElementById(keyIds[lane]);
            keyEl.classList.add('active');
            setTimeout(() => keyEl.classList.remove('active'), 100);

            // Find closest note in lane
            let closestNote = null;
            let closestDist = Infinity;

            notes.forEach(note => {
                if (note.lane !== lane || note.hit || note.missed) return;
                const dist = Math.abs(note.y - HIT_Y);
                if (dist < closestDist && dist < GOOD_WINDOW) {
                    closestDist = dist;
                    closestNote = note;
                }
            });

            if (closestNote) {
                closestNote.hit = true;

                // Determine hit quality
                let quality, points;
                if (closestDist <= PERFECT_WINDOW) {
                    quality = 'PERFECT';
                    points = 300;
                    hits.perfect++;
                } else if (closestDist <= GREAT_WINDOW) {
                    quality = 'GREAT';
                    points = 200;
                    hits.great++;
                } else {
                    quality = 'GOOD';
                    points = 100;
                    hits.good++;
                }

                combo++;
                if (combo > maxCombo) maxCombo = combo;

                const comboBonus = Math.floor(combo / 10);
                score += points * (1 + comboBonus * 0.1);

                showFeedback(quality, quality.toLowerCase());
                if (combo > 0 && combo % 25 === 0) {
                    showComboPopup(combo);
                }
                updateDisplay();
            }
        }

        function showFeedback(text, className) {
            const el = document.getElementById('hitFeedback');
            el.textContent = text;
            el.className = 'hit-feedback show ' + className;
            setTimeout(() => el.classList.remove('show'), 300);
        }

        function showComboPopup(combo) {
            const el = document.getElementById('comboPopup');
            el.textContent = combo + 'x COMBO!';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 500);
        }

        function updateDisplay() {
            document.getElementById('scoreDisplay').textContent = Math.floor(score);
            document.getElementById('comboDisplay').textContent = combo;

            const totalHits = hits.perfect + hits.great + hits.good + hits.miss;
            const accuracy = totalHits > 0 ?
                Math.round(((hits.perfect * 100 + hits.great * 80 + hits.good * 50) / (totalHits * 100)) * 100) : 100;
            document.getElementById('accuracyDisplay').textContent = accuracy + '%';
        }

        function endGame() {
            gameRunning = false;

            const finalScore = Math.floor(score);
            const totalHits = hits.perfect + hits.great + hits.good + hits.miss;
            const accuracy = totalHits > 0 ?
                Math.round(((hits.perfect * 100 + hits.great * 80 + hits.good * 50) / (totalHits * 100)) * 100) : 0;

            // Calculate grade
            let grade, gradeClass;
            if (accuracy >= 95 && hits.miss === 0) { grade = 'S'; gradeClass = 's'; }
            else if (accuracy >= 90) { grade = 'A'; gradeClass = 'a'; }
            else if (accuracy >= 80) { grade = 'B'; gradeClass = 'b'; }
            else if (accuracy >= 60) { grade = 'C'; gradeClass = 'c'; }
            else { grade = 'F'; gradeClass = 'f'; }

            // Calculate coins (with VIP multiplier)
            let baseCoins = Math.floor(finalScore / 100);
            if (grade === 'S') baseCoins *= 2;
            const earnedCoins = typeof VIPSystem !== 'undefined' ? VIPSystem.applyMultiplier(baseCoins) : baseCoins;

            // Update save data
            saveData.coins += earnedCoins;
            saveData.totalPlays++;
            if (!saveData.highScores[currentSong.id] || finalScore > saveData.highScores[currentSong.id]) {
                saveData.highScores[currentSong.id] = finalScore;
                saveData.bestGrade[currentSong.id] = grade;
            }
            save();
            updateCoinsDisplay();

            // Show results
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('maxCombo').textContent = maxCombo;
            document.getElementById('finalAccuracy').textContent = accuracy + '%';
            document.getElementById('coinsEarned').textContent = '+' + earnedCoins;
            document.getElementById('perfectCount').textContent = hits.perfect;
            document.getElementById('greatCount').textContent = hits.great;
            document.getElementById('goodCount').textContent = hits.good;
            document.getElementById('missCount').textContent = hits.miss;

            const gradeEl = document.getElementById('gradeDisplay');
            gradeEl.textContent = grade;
            gradeEl.className = 'grade ' + gradeClass;

            document.getElementById('resultsScreen').classList.remove('hidden');
        }

        // Key bindings
        const KEY_MAP = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };

        document.addEventListener('keydown', (e) => {
            const tag = document.activeElement?.tagName?.toLowerCase();
            if (tag === 'input' || tag === 'textarea') return;

            const key = e.key.toLowerCase();
            if (KEY_MAP.hasOwnProperty(key)) {
                e.preventDefault();
                handleKeyPress(KEY_MAP[key]);
            }

            // Admin/Owner sequence detection
            adminKeyBuffer += key;
            ownerKeyBuffer += key;
            if (adminKeyBuffer.length > 5) adminKeyBuffer = adminKeyBuffer.slice(-5);
            if (ownerKeyBuffer.length > 5) ownerKeyBuffer = ownerKeyBuffer.slice(-5);
            if (adminKeyBuffer === 'admin') { showAdminLogin(); adminKeyBuffer = ''; }
            if (ownerKeyBuffer === 'owner') { showOwnerLogin(); ownerKeyBuffer = ''; }
        });

        // Button handlers
        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            renderSongList();
        });

        // VIP button
        document.getElementById('vipBtn').addEventListener('click', () => {
            if (typeof VIPSystem !== 'undefined') {
                if (VIPSystem.isVIP()) {
                    VIPSystem.showStatusModal();
                } else {
                    VIPSystem.showActivationModal();
                }
            }
        });

        // Admin Panel System
        const ADMIN_PASSWORD = 'rhythm123';
        const OWNER_PASSWORD = 'JsgOwner2024X';
        let adminKeyBuffer = '';
        let ownerKeyBuffer = '';

        function showAdminLogin() {
            const modal = document.createElement('div');
            modal.className = 'admin-modal';
            modal.id = 'adminLoginModal';
            modal.innerHTML = `
                <div class="admin-content">
                    <h2>ADMIN LOGIN</h2>
                    <input type="password" id="adminPwInput" placeholder="Enter Password" maxlength="20">
                    <div>
                        <button class="admin-btn admin-btn-primary" onclick="verifyAdminPw()">LOGIN</button>
                        <button class="admin-btn admin-btn-close" onclick="closeAdminModal()">CANCEL</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('adminPwInput').focus();
        }

        function showOwnerLogin() {
            const modal = document.createElement('div');
            modal.className = 'admin-modal';
            modal.id = 'ownerLoginModal';
            modal.innerHTML = `
                <div class="admin-content owner">
                    <h2>OWNER LOGIN</h2>
                    <input type="password" id="ownerPwInput" placeholder="Enter Password" maxlength="20">
                    <div>
                        <button class="admin-btn admin-btn-owner" onclick="verifyOwnerPw()">LOGIN</button>
                        <button class="admin-btn admin-btn-close" onclick="closeAdminModal()">CANCEL</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('ownerPwInput').focus();
        }

        function verifyAdminPw() {
            if (document.getElementById('adminPwInput').value === ADMIN_PASSWORD) {
                closeAdminModal();
                showAdminPanel();
            } else {
                document.getElementById('adminPwInput').value = '';
                alert('Wrong password!');
            }
        }

        function verifyOwnerPw() {
            if (document.getElementById('ownerPwInput').value === OWNER_PASSWORD) {
                closeAdminModal();
                showOwnerPanel();
            } else {
                document.getElementById('ownerPwInput').value = '';
                alert('Wrong password!');
            }
        }

        function closeAdminModal() {
            ['adminLoginModal', 'ownerLoginModal', 'adminPanelModal', 'ownerPanelModal']
                .forEach(id => document.getElementById(id)?.remove());
        }

        function showAdminPanel() {
            const modal = document.createElement('div');
            modal.className = 'admin-modal';
            modal.id = 'adminPanelModal';
            modal.innerHTML = `
                <div class="admin-content">
                    <h2>ADMIN PANEL</h2>
                    <p style="color:#888;font-size:0.45rem;">Coins: ${saveData.coins}</p>
                    <div class="admin-actions">
                        <button class="admin-action-btn" onclick="adminAddCoins(1000)">+1000 Coins</button>
                        <button class="admin-action-btn" onclick="adminAddCoins(10000)">+10K Coins</button>
                        <button class="admin-action-btn" onclick="adminUnlockSongs()">Unlock All Songs</button>
                        <button class="admin-action-btn" onclick="adminPerfectScore()">Perfect Score</button>
                    </div>
                    <button class="admin-btn admin-btn-close" style="margin-top:20px;" onclick="closeAdminModal()">CLOSE</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showOwnerPanel() {
            const modal = document.createElement('div');
            modal.className = 'admin-modal';
            modal.id = 'ownerPanelModal';
            modal.innerHTML = `
                <div class="admin-content owner">
                    <h2>OWNER PANEL</h2>
                    <p style="color:#888;font-size:0.45rem;">Coins: ${saveData.coins}</p>
                    <div class="admin-actions">
                        <button class="admin-action-btn" onclick="ownerSetCoins()">Set Coins</button>
                        <button class="admin-action-btn" onclick="ownerInfiniteCoins()">Infinite Coins</button>
                        <button class="admin-action-btn" onclick="adminUnlockSongs()">Unlock Everything</button>
                        <button class="admin-action-btn" onclick="ownerSetAllS()">All S Ranks</button>
                        <button class="admin-action-btn danger" onclick="ownerReset()">RESET</button>
                    </div>
                    <button class="admin-btn admin-btn-close" style="margin-top:20px;" onclick="closeAdminModal()">CLOSE</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function adminAddCoins(amount) {
            saveData.coins += amount;
            save();
            updateCoinsDisplay();
            closeAdminModal();
        }

        function adminUnlockSongs() {
            SONGS.forEach(s => {
                if (!saveData.unlockedSongs.includes(s.id)) {
                    saveData.unlockedSongs.push(s.id);
                }
            });
            save();
            renderSongList();
            closeAdminModal();
        }

        function adminPerfectScore() {
            if (currentSong) {
                saveData.highScores[currentSong.id] = 99999;
                saveData.bestGrade[currentSong.id] = 'S';
                save();
                renderSongList();
            }
            closeAdminModal();
        }

        function ownerSetCoins() {
            const amount = prompt('Enter coin amount:');
            if (amount && !isNaN(amount)) {
                saveData.coins = parseInt(amount);
                save();
                updateCoinsDisplay();
            }
            closeAdminModal();
        }

        function ownerInfiniteCoins() {
            saveData.coins = 999999999;
            save();
            updateCoinsDisplay();
            closeAdminModal();
        }

        function ownerSetAllS() {
            SONGS.forEach(s => {
                saveData.highScores[s.id] = 99999;
                saveData.bestGrade[s.id] = 'S';
                if (!saveData.unlockedSongs.includes(s.id)) {
                    saveData.unlockedSongs.push(s.id);
                }
            });
            save();
            renderSongList();
            closeAdminModal();
        }

        function ownerReset() {
            if (confirm('RESET ALL PROGRESS?')) {
                localStorage.removeItem(SAVE_KEY);
                location.reload();
            }
        }

        // Initialize
        loadSave();
        renderSongList();
        selectSong('tutorial');
        document.getElementById('highScoreDisplay').textContent =
            Math.max(...Object.values(saveData.highScores), 0);

        if (typeof VIPSystem !== 'undefined') {
            VIPSystem.showIndicator();
        }
    </script>
</body>
</html>

<script>
// ============================================
// CENTRALIZED ADMIN SYSTEM
// ============================================
(async function() {
    try {
        const resp = await fetch('api/game-admin.php?action=check&game=rhythm', { credentials: 'include' });
        const data = await resp.json();
        if (data.success && data.isAdmin) {
            // Auto-unlock admin if server says so
            window.serverAdmin = true;
        }
        if (data.success && data.isOwner) {
            window.serverOwner = true;
        }
    } catch (e) { console.log('Admin check failed'); }
})();

// Hook into admin login
const origAdminLogin = window.adminLogin;
window.adminLogin = async function() {
    const pw = document.getElementById('adminPwInput')?.value;
    try {
        const resp = await fetch('api/game-admin.php?action=unlock&game=rhythm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            credentials: 'include',
            body: 'password=' + encodeURIComponent(pw)
        });
        const data = await resp.json();
        if (data.success) {
            if (origAdminLogin) origAdminLogin();
            else alert(data.message);
        } else {
            alert(data.error || 'Invalid password');
        }
    } catch (e) {
        if (origAdminLogin) origAdminLogin();
    }
};
</script>
