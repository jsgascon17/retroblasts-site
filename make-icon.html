<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSBG7067J2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZSBG7067J2');
    </script>
    <title>Download Icon</title>
    <style>
        body { 
            background: #1a1a2e; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas { border: 2px solid #ffd700; margin: 20px; }
        a { 
            background: #ffd700; 
            color: #000; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
        }
        a:hover { background: #ff8c00; }
        h1 { color: #ffd700; }
    </style>
</head>
<body>
    <h1>RetroBlasts Icon</h1>
    <canvas id="icon" width="64" height="64"></canvas>
    <a id="download" download="retroblasts-icon.png">Download 64x64 Icon</a>

    <script>
        const canvas = document.getElementById('icon');
        const ctx = canvas.getContext('2d');
        
        // Background gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 64, 64);
        bgGrad.addColorStop(0, '#1a1a2e');
        bgGrad.addColorStop(1, '#0f3460');
        
        // Rounded rectangle
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 12);
        ctx.fillStyle = bgGrad;
        ctx.fill();
        
        // Gold gradient for text
        const goldGrad = ctx.createLinearGradient(0, 0, 64, 32);
        goldGrad.addColorStop(0, '#ffd700');
        goldGrad.addColorStop(1, '#ff8c00');
        
        // RB text
        ctx.font = 'bold 22px Arial Black, Arial, sans-serif';
        ctx.fillStyle = goldGrad;
        ctx.textAlign = 'center';
        ctx.fillText('RB', 32, 30);
        
        // Game controller emoji
        ctx.font = '18px Arial';
        ctx.fillText('🎮', 32, 52);
        
        // Set download link
        document.getElementById('download').href = canvas.toDataURL('image/png');
    </script>
</body>
</html>
