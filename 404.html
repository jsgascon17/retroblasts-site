<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSBG7067J2"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | RetroBlasts</title>
    <meta name="description" content="Oops! This page does not exist. Head back to RetroBlasts to play free online games.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://retroblasts.com/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: colorShift 3s ease infinite;
            text-shadow: 0 0 50px rgba(255, 107, 107, 0.3);
        }
        @keyframes colorShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }
        h1 { font-size: 2rem; margin: 20px 0 10px; color: #fff; }
        p { color: #888; font-size: 1.1rem; margin-bottom: 30px; max-width: 400px; }
        .pacman-animation {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 30px 0;
            font-size: 2rem;
        }
        .pacman {
            animation: chomp 0.3s infinite;
        }
        @keyframes chomp {
            0%, 100% { content: "😮"; }
            50% { content: "😶"; }
        }
        .dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #ffd93d;
            border-radius: 50%;
            animation: disappear 1.5s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        .dot:nth-child(4) { animation-delay: 0.9s; }
        @keyframes disappear {
            0%, 70% { opacity: 1; transform: scale(1); }
            80%, 100% { opacity: 0; transform: scale(0); }
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #4d96ff, #6bcb77);
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(77, 150, 255, 0.3);
        }
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(77, 150, 255, 0.4);
        }
        .game-suggestions {
            margin-top: 50px;
            color: #666;
        }
        .game-suggestions h3 {
            color: #888;
            margin-bottom: 15px;
        }
        .games-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-link {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 20px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .game-link:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <h1>Game Over!</h1>
    <p>The page you are looking for has been eaten by Pac-Man... or maybe it never existed!</p>
    
    <div class="pacman-animation">
        <span class="pacman">😮</span>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <a href="/" class="home-btn">
        <span>🎮</span>
        <span>Back to Games</span>
    </a>
    
    <div class="game-suggestions">
        <h3>Try these popular games:</h3>
        <div class="games-list">
            <a href="/flappy-bird.html" class="game-link">🐦 Flappy Bird</a>
            <a href="/snake.html" class="game-link">🐍 Snake</a>
            <a href="/tetris.html" class="game-link">🟦 Tetris</a>
            <a href="/pacman.html" class="game-link">👻 Pac-Man</a>
            <a href="/chess.html" class="game-link">♟️ Chess</a>
        </div>
    </div>
    
    <script>
        // Fun animation for the Pac-Man
        const pacman = document.querySelector(".pacman");
        setInterval(() => {
            pacman.textContent = pacman.textContent === "😮" ? "😶" : "😮";
        }, 200);
    </script>
</body>
</html>
